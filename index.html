  }

  /* innerHTML 로 매번 새로 그려지므로 렌더 직후 여기서 다시 연결한다 */
  function bindTicket(run){
    var stage = tk('tkStage'), feed = tk('tkFeed'), ticket = tk('tkTicket'), sky = tk('tkSky');
    function live(){ return run === tkRun && mode === 'contact' && !detailEl.hidden; }

    /* 자동으로 채우는 칸 : 편명 · 좌석 · 탑승 시각 · 날짜 */
    function pad(n){ return (n < 10 ? '0' : '') + n; }
    function fill(){
      var d = new Date();
      var seat = (1 + Math.floor(Math.random() * 32)) + 'ABCDEF'.charAt(Math.floor(Math.random() * 6));
      var flight = 'HJ ' + pad(d.getMonth() + 1) + pad(d.getDate());
      tk('tkFlight').textContent = flight;
      tk('tkSeat').textContent = seat;
      tk('tkBoard').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
      tk('tkSSeat').textContent = seat;
      tk('tkSDate').textContent = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
      tk('tkSCode').textContent = flight + ' · ' + seat;
      drawBars();
    }

    /* 이름으로 출발지 코드 만들기 : 한글은 앞 세 글자, 영문은 머리글자 */
    function codeOf(n){
      n = n.trim();
      if (!n) return 'YOU';
      if (/[가-힣]/.test(n)) return n.replace(/\s+/g, '').slice(0, 3);
      var w = n.split(/\s+/);
      var c = w.length > 1 ? w.map(function(x){ return x.charAt(0); }).join('') : n;
      return (c.replace(/[^a-z]/gi, '').slice(0, 3).toUpperCase()) || 'YOU';
    }

    /* 이름과 좌석으로 매번 다른 바코드 */
    function hash(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
    function drawBars(){
      var seed = hash(tk('tkName').value + tk('tkSSeat').textContent) || 7, out = '';
      for (var i = 0; i < 46; i++){
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        out += '<i style="width:' + (1 + seed % 3) + 'px;margin-right:' + (1 + (seed >>> 8) % 2) + 'px"></i>';
      }
      tk('tkBars').innerHTML = out;
    }

    function gates(){
      tk('tkGate').innerHTML = t('gates').map(function(g){ return '<option>' + esc(g) + '</option>'; }).join('');
      tk('tkSGate').textContent = t('gates')[0];
    }

    tk('tkName').addEventListener('input', function(){
      var v = this.value.trim();
      tk('tkFromCode').textContent = codeOf(v);
      tk('tkFromName').textContent = v || t('tk_visitor');
      tk('tkSName').textContent = v || t('tk_visitor');
      drawBars();
    });
    tk('tkGate').addEventListener('change', function(){ tk('tkSGate').textContent = this.value; });
    tk('tkMsg').addEventListener('input', function(){ this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });

    /* 입력 확인 : 이름 · 메일 · 내용 */
    function setErr(id, msg){
      var w = tk(id).closest('.tk-f');
      w.classList.toggle('tk-bad', !!msg);
      w.querySelector('.tk-err').textContent = msg || '';
    }
    ['tkName', 'tkMail', 'tkMsg'].forEach(function(id){
      tk(id).addEventListener('input', function(){ setErr(id, ''); });
    });
    function check(){
      var ok = true;
      if (!tk('tkName').value.trim()){ setErr('tkName', t('tk_errName')); ok = false; }
      var m = tk('tkMail').value.trim();
      if (!m){ setErr('tkMail', t('tk_errMail')); ok = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){ setErr('tkMail', t('tk_errMailFmt')); ok = false; }
      if (!tk('tkMsg').value.trim()){ setErr('tkMsg', t('tk_errMsg')); ok = false; }
      return ok;
    }

    /* 전송 : 키가 없으면 mailto, 있으면 Web3Forms */
    function data(){
      return {
        name: tk('tkName').value.trim(),
        email: tk('tkMail').value.trim(),
        subject: tk('tkSubj').value.trim(),
        gate: tk('tkGate').value,
        message: tk('tkMsg').value.trim(),
        seat: tk('tkSSeat').textContent,
        flight: tk('tkFlight').textContent
      };
    }
    function subjectOf(d){ return '[' + t('tk_subjTag') + ' · ' + d.gate + '] ' + (d.subject || t('tk_subjDefault', {name:d.name})); }
    function send(d){
      if (!CONTACT.web3formsKey) return Promise.resolve('mailto');
      return fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
        body: JSON.stringify({
          access_key: CONTACT.web3formsKey,
          subject: subjectOf(d),
          from_name: t('site'),
          name: d.name, email: d.email, message: d.message,
          gate: d.gate, seat: d.seat, flight: d.flight
        })
      }).then(function(r){ return r.json(); })
        .then(function(j){ return j && j.success ? 'sent' : 'fail'; })
        .catch(function(){ return 'fail'; });
    }
    function openMail(d){
      var body = d.message + '\n\n— ' + d.name + ' (' + d.email + ')\n' + t('tk_bodyMeta', {gate:d.gate, seat:d.seat, flight:d.flight});
      location.href = 'mailto:' + CONTACT.to
        + '?subject=' + encodeURIComponent(subjectOf(d))
        + '&body=' + encodeURIComponent(body);
    }

    /* 비행 경로 : 지나간 자리에 점을 찍는다 */
    function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
    function takeoff(){
      return new Promise(function(done){
        var sr = stage.getBoundingClientRect(), mr = tk('tkMain').getBoundingClientRect();
        var sx = mr.left - sr.left + mr.width * 0.5, sy = mr.top - sr.top + mr.height * 0.45;
        var ex = sr.width + 120, ey = -Math.max(220, sr.top + 120);
        var cx = sx + (ex - sx) * 0.72, cy = sy + 10;
        var NS = 'http://www.w3.org/2000/svg';
        sky.style.opacity = 1;
        sky.innerHTML = '';
        var trail = document.createElementNS(NS, 'path');
        trail.setAttribute('d', 'M' + sx + ' ' + sy + ' Q' + cx + ' ' + cy + ' ' + ex + ' ' + ey);
        trail.setAttribute('fill', 'none');
        sky.appendChild(trail);
        var plane = document.createElementNS(NS, 'path');
        plane.setAttribute('class', 'tk-pl');
        plane.setAttribute('d', PLANE);
        sky.appendChild(plane);

        var L = trail.getTotalLength(), T = 1150, t0 = null, lastDot = 0;
        function step(ts){
          if (!live()){ done(); return; }
          if (t0 === null) t0 = ts;
          var t = Math.min(1, (ts - t0) / T), s = t * t;
          var l = L * s, p = trail.getPointAtLength(l), q = trail.getPointAtLength(Math.min(L, l + 1));
          var a = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
          plane.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ') rotate(' + a + ')');
          while (lastDot + 14 < l - 18){
            lastDot += 14;
            var pt = trail.getPointAtLength(lastDot), c = document.createElementNS(NS, 'circle');
            c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.setAttribute('r', 1.6);
            sky.insertBefore(c, plane);
          }
          if (t < 1) requestAnimationFrame(step);
          else { setTimeout(function(){ sky.style.opacity = 0; }, 500); done(); }
        }
        requestAnimationFrame(step);
      });
    }

    /* 보내기 순서 : 도장 → 떼어내기 → 날아가기 → 이륙 → 완료 */
    ticket.addEventListener('submit', async function(e){
      e.preventDefault();
      tk('tkFail').hidden = true;
      if (!check()) return;

      var d = data(), btn = tk('tkSend');
      btn.disabled = true;
      btn.textContent = t('tk_issuing');

      var result = await send(d);
      if (!live()) return;
      if (result === 'fail'){
        btn.disabled = false;
        btn.textContent = t('tk_send');
        tk('tkFail').hidden = false;
        tk('tkFail').textContent = t('tk_fail');
        return;
      }

      ticket.querySelectorAll('input,select,textarea').forEach(function(el){ el.readOnly = true; el.disabled = el.tagName === 'SELECT'; });
      tk('tkDText').textContent = result === 'sent'
        ? t('tk_doneSent', {email:d.email})
        : t('tk_doneMail');

      ticket.classList.add('tk-stamped');
      if (still.matches){
        stage.classList.add('tk-landed');
        tk('tkMain').style.visibility = 'hidden';
      } else {
        await wait(560);
        if (!live()) return;
        ticket.classList.add('tk-torn');
        await wait(380);
        if (!live()) return;
        ticket.classList.add('tk-flown');
        await takeoff();
        if (!live()) return;
        stage.classList.add('tk-landed');
      }
      if (result === 'mailto') setTimeout(function(){ if (live()) openMail(d); }, 400);
    });

    /* 다시 쓰기 */
    tk('tkAgain').addEventListener('click', function(e){
      e.preventDefault();
      stage.classList.remove('tk-landed');
      ticket.classList.remove('tk-stamped', 'tk-torn', 'tk-flown');
      tk('tkMain').style.visibility = '';
      ticket.reset();
      ticket.querySelectorAll('input,select,textarea').forEach(function(el){ el.readOnly = false; el.disabled = false; });
      tk('tkFromCode').textContent = 'YOU'; tk('tkFromName').textContent = t('tk_visitor');
      tk('tkSName').textContent = t('tk_visitor'); tk('tkSGate').textContent = t('gates')[0];
      tk('tkSend').disabled = false; tk('tkSend').textContent = t('tk_send');
      tk('tkMsg').style.height = '';
      sky.innerHTML = '';
      fill();
      print();
    });

    /* 등장 : 프린터에서 출력되듯 */
    function print(){
      if (still.matches){ feed.classList.add('tk-ready'); return; }
      feed.classList.remove('tk-ready', 'tk-go');
      void feed.offsetWidth;
      stage.classList.add('tk-printing');
      feed.classList.add('tk-go');
      setTimeout(function(){
        if (!live()) return;
        stage.classList.remove('tk-printing');
        feed.classList.add('tk-ready');
      }, 1600);
    }

    gates();
    fill();
    print();
  }

  function openContact(){
    closeViewer();
    hideHint();
    cur = null;
    plates = []; views = [];
    steps = []; path = []; figEls = [];
    if (raf){ cancelAnimationFrame(raf); raf = 0; lastT = 0; }
    mode = 'contact';
    tkRun++;
    detailEl.classList.remove('paged');
    detailEl.innerHTML = ticketHTML();
    document.documentElement.classList.add('tk-on');
    pageEl.hidden = true;
    detailEl.hidden = false;
    document.title = t('tk_title') + ' — ' + t('site');
    window.scrollTo(0, 0);
    bindTicket(tkRun);
    tk('tkIntro').focus({preventScroll:true});
  }

  function closeDetail(){
    if (detailEl.hidden) return;
    closeViewer();
    detailEl.hidden = true;
    pageEl.hidden = false;
    document.title = t('docTitle');
    hideHint();
    detailEl.classList.remove('paged');
    document.documentElement.classList.remove('tk-on');
  }

  function route(){
    var id = location.hash.slice(1);
    if (id === 'contact'){
      if (!(mode === 'contact' && !detailEl.hidden)) openContact();
      return;
    }
    var it = null;
    for (var k = 0; k < ITEMS.length; k++){
      if (ITEMS[k].id === id){ it = ITEMS[k]; break; }
    }
    if (it) openDetail(it);
    else closeDetail();
  }

  /* ---- \ub3c4\ud310 \uc804\uccb4 \ud654\uba74 \ubdf0\uc5b4 ---- */
  var viewer  = document.getElementById('viewer');
  var vwStage = document.getElementById('vwStage');
  var vwFrame = document.getElementById('vwFrame');
  var vwPlate = document.getElementById('vwPlate');
  var vwInfo  = document.getElementById('vwInfo');
  var vwCount = document.getElementById('vwCount');
  var vwPrev  = document.getElementById('vwPrev');
  var vwNext  = document.getElementById('vwNext');
  var vwFull  = document.getElementById('vwFull');
  var vwClose = document.getElementById('vwClose');
  var PLATE_W = 260;              // \uae30\uc900 \ud310 \ud3ed. \uc2e4\uc81c \ud3ed\uacfc\uc758 \ube44\uc728\ub9cc\ud07c scale
  var vwI = 0, lastFocus = null;

  function fitPlate(){
    if (viewer.hidden) return;
    vwPlate.style.transform = 'scale(' + (vwFrame.clientWidth / PLATE_W) + ')';
  }

  function paintViewer(){
    var f = views[vwI];
    if (!f || !cur) return;
    vwPlate.innerHTML = f.html;
    document.getElementById('vwId').textContent = cur.id + ' \u00b7 ' + when(cur);
    document.getElementById('vwLead').textContent = cur.title;
    vwInfo.innerHTML = '<div class="t">' + esc(f.label) + '</div>'
                     + '<div class="m">' + esc(CAT[cur.cat]) + ' \u00b7 ' + esc(cur.sub) + '</div>';
    vwCount.textContent = (vwI + 1) + ' / ' + views.length;
    vwPrev.disabled = vwI === 0;
    vwNext.disabled = vwI === views.length - 1;
    fitPlate();
  }

  function stepViewer(d){
    var n = Math.max(0, Math.min(views.length - 1, vwI + d));
    if (n === vwI) return;
    vwI = n;
    paintViewer();
  }

  function openViewer(){
    if (!cur || !views.length || !viewer.hidden) return;
    lastFocus = document.activeElement;
    /* 지금 단계에서 보고 있던 사진부터 */
    var p = plates[activeFig], j = p && p.photos ? p.sub : 0;
    vwI = 0;
    for (var n = 0; n < views.length; n++) if (views[n].k === activeFig && views[n].j === j){ vwI = n; break; }
    viewer.hidden = false;
    document.body.style.overflow = 'hidden';
    paintViewer();
    vwClose.focus();
  }

  function closeViewer(){
    if (viewer.hidden) return;
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    viewer.hidden = true;
    document.body.style.overflow = '';
    /* 뷰어에서 넘긴 도판에 맞춰 본문 단계와 그 단계의 사진도 옮긴다 */
    var v = views[vwI];
    if (mode === 'article' && steps.length && v){
      setSub(v.k, v.j);
      if (v.k !== shown) moveTo(firstStop(v.k));
    }
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function paintFull(){
    vwFull.textContent = document.fullscreenElement
      ? t('exitFull')
      : t('fullscreen');
  }

  if (!viewer.requestFullscreen) vwFull.hidden = true;
  vwFull.addEventListener('click', function(){
    if (document.fullscreenElement){ document.exitFullscreen(); return; }
    var r = viewer.requestFullscreen();
    if (r && r.catch) r.catch(function(){});
  });
  document.addEventListener('fullscreenchange', function(){ paintFull(); fitPlate(); });

  document.getElementById('dtOpenFig').addEventListener('click', openViewer);
  vwClose.addEventListener('click', closeViewer);
  vwPrev.addEventListener('click', function(){ stepViewer(-1); });
  vwNext.addEventListener('click', function(){ stepViewer(1); });
  vwStage.addEventListener('click', function(e){ if (e.target === vwStage) closeViewer(); });
  window.addEventListener('resize', fitPlate);

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (viewer.hidden){
      if (detailEl.hidden || mode !== 'article') return;
      if (e.key === 'f' || e.key === 'F'){ e.preventDefault(); openViewer(); }
      else if (e.key === 'ArrowDown' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)){ e.preventDefault(); go(1); }
      else if (e.key === 'ArrowUp' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)){ e.preventDefault(); go(-1); }
      else if (e.key === 'ArrowRight' && multiAt(shown)){ e.preventDefault(); flip(1); }
      else if (e.key === 'ArrowLeft' && multiAt(shown)){ e.preventDefault(); flip(-1); }
      else if (e.key === 'Home'){ e.preventDefault(); moveTo(0); }
      else if (e.key === 'End'){ e.preventDefault(); moveTo(path.length - 1); }
      return;
    }
    if (e.key === 'Escape'){
      if (document.fullscreenElement) return;   // \ub124\uc774\ud2f0\ube0c \uc804\uccb4 \ud654\uba74\uc740 \ube0c\ub77c\uc6b0\uc800\uac00 \uba3c\uc800 \ud574\uc81c
      closeViewer();
    }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); stepViewer(1); }
    else if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'){ e.preventDefault(); stepViewer(-1); }
    else if (e.key === 'Home'){ e.preventDefault(); vwI = 0; paintViewer(); }
    else if (e.key === 'End'){ e.preventDefault(); vwI = views.length - 1; paintViewer(); }
  });

  /* 언어를 바꾸면 보고 있던 화면을 그 언어로 다시 연다 (세부 페이지는 보던 단계 그대로) */
  onLang.push(function(){
    if (detailEl.hidden){ document.title = t('docTitle'); return; }
    if (mode === 'contact'){ openContact(); return; }
    if (!cur) return;
    var it = ITEMS.find(function(x){ return x.id === cur.id; });
    if (!it) return;
    keepAt = shown < 0 ? 0 : shown;
    openDetail(it);
  });

  window.addEventListener('hashchange', route);
  route();
})();

} /* boot */


/* =========================================================
   LOAD — data.json 을 읽어 ITEMS · DETAIL 을 채우고 boot()
   file:// 로 열면 브라우저가 fetch 를 막으므로 안내만 띄운다.
   ========================================================= */
fetch('data.json', {cache:'no-store'})
  .then(function(r){
    if (!r.ok) throw new Error('data.json ' + r.status);
    return r.json();
  })
  .then(function(j){
    RAW = { items: j.items || [], detail: j.detail || {} };
    localize();
    return true;
  }, function(err){
    console.error(err);
    document.getElementById('out').innerHTML = '<p class="empty"><b>' + t('loadFailB') + '</b>' + t('loadFailT') + '</p>';
    return false;
  })
  .then(function(ok){ if (ok) boot(); });

</script>
