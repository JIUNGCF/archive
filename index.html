<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한지웅의 아카이브 — 연구 · 활동 · 개발 · 독서</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath fill='%23fff' d='M9 7h4.2v7.1h5.6V7H23v18h-4.2v-7.2h-5.6V25H9z'/%3E%3C/svg%3E">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#000;
  --fg:#fff;
  --dim:#8a8a8a;
  --rule:#242424;
  --paper:#ebe9e3;
  --ink:#121212;
  --red:#e0301e;
  --pad:22px;
  --lab:#121212;   /* 탑승권 라벨 · 보조 글씨 (흰 종이 위 가독성을 위해 검정) */
  --line:#c9c5bc;  /* 탑승권 밑줄 */
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:"Pretendard Variable","Pretendard","Helvetica Neue",Helvetica,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
  font-size:12px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
  /* 한국어를 글자 단위가 아니라 띄어쓰기 단위로 줄바꿈 ("2024 / 년" 처럼 끊기지 않게).
     띄어쓰기 없는 긴 영문 · 주소만 필요할 때 중간에서 자른다 */
  word-break:keep-all;
  overflow-wrap:break-word;
}
a{color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px}
a:hover{color:var(--red);text-decoration-color:var(--red)}
:focus-visible{outline:1px solid var(--red);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3{font-size:12px;font-weight:700;margin:0;letter-spacing:-0.015em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- page frame : 명시적 area 배치 ---------- */
.page{
  display:grid;
  grid-template-columns:minmax(0,1fr) 172px;
  grid-template-areas:
    "head rail"
    "main rail"
    "foot foot";
  align-items:start;
  gap:0 32px;
  padding:var(--pad) 28px;
  max-width:2400px;
  margin:0 auto;
}
.masthead{grid-area:head}
.rail{grid-area:rail;min-width:0}
.main{grid-area:main;min-width:0}
.foot{grid-area:foot;min-width:0}

/* ---------- masthead ---------- */
.masthead{
  display:grid;
  grid-template-columns:minmax(180px,300px) minmax(0,1fr);
  gap:0 20px;
  align-items:start;
  padding-bottom:34px;
}
.brand h1{font-size:13px}
.brand p{margin:1px 0 0;color:var(--dim);letter-spacing:.055em}
.navrow ul{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,190px));
  gap:0 20px;
  justify-content:start;
}
.navrow a{white-space:nowrap}

/* ---------- right rail ---------- */
.search{
  display:block;
  width:100%;
  background:#fff;
  border:0;
  color:#111;
  font:inherit;
  padding:3px 6px;
  border-radius:2px;
}
.search::placeholder{color:#8f8f8f}
/* 검색 옆 언어 선택 KO / EN */
.srow{display:flex;align-items:center;gap:0 10px}
.srow .search{flex:1 1 auto;min-width:0}
.lang{flex:0 0 auto;display:flex;align-items:baseline;gap:0 4px;color:#4f4f4f}
.lang button{color:var(--dim);letter-spacing:.04em}
.lang button[aria-pressed="true"]{color:var(--fg);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px}
.lang button:hover{color:var(--red)}
.rail .status{margin:12px 0 0}
.rail .updates{margin-top:30px}
.rail .updates h3{font-weight:400}
.rail .updates li{margin-top:16px}
.rail .updates .d{display:block}

/* ---------- index bar ---------- */
.indexbar{padding-bottom:26px}
.indexbar h2{font-size:13px;margin-bottom:2px}
.controls{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 14px}
.controls .set{display:flex;gap:0 5px;align-items:baseline}
.controls .sep{color:var(--dim)}
.ctl{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px;color:var(--dim)}
.ctl:hover{color:var(--red);text-decoration-color:var(--red)}
.ctl[aria-pressed="true"]{color:var(--fg);text-decoration-color:var(--fg)}
.tally{color:var(--dim);margin-left:auto;padding-left:14px}

/* ---------- year groups + grid ---------- */
.year{margin-bottom:34px}
.year > h3{font-size:13px;margin-bottom:9px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:22px 20px;
}
.item{display:block;text-decoration:none;color:inherit;min-width:0}
.item:hover{color:inherit}
/* padding 비율 박스 — aspect-ratio 미지원 환경에서도 높이 보장 */
.frame{
  display:block;
  position:relative;
  width:100%;
  height:0;
  padding-top:137%;
  overflow:hidden;
  background:var(--paper);
  color:var(--ink);
}
.item:hover .frame,
.item:focus-visible .frame{box-shadow:0 0 0 1px var(--red)}
.cap{display:flex;gap:0 8px;margin-top:6px;color:var(--dim)}
.cap .t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover .cap .t{color:var(--fg)}
.cap .n{flex:0 0 auto}

.foot .admin{margin-left:auto}
.empty{color:var(--dim);padding:4px 0 40px;max-width:38em}
.empty b{display:block;color:var(--fg);font-weight:400}

.foot{
  border-top:1px solid var(--rule);
  margin-top:6px;
  padding-top:12px;
  display:flex;
  flex-wrap:wrap;
  gap:0 18px;
  color:var(--dim);
}

/* ---------- cover templates ---------- */
.cv{position:absolute;top:0;right:0;bottom:0;left:0;padding:9px;display:flex;flex-direction:column;overflow:hidden}
.cv.dark{background:#0a0a0a;color:#f2f2f2}

/* T1 gridnum */
.t-gridnum .row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.t-gridnum .kick{font-size:9px;line-height:1.25;max-width:56%}
.t-gridnum .no{font-size:26px;line-height:.82;letter-spacing:-0.04em;flex:0 0 auto}
.t-gridnum .mid{margin:auto 0;display:flex;gap:10px}
.t-gridnum .mid span{font-size:10px;line-height:1.25;display:block;min-width:0}
.t-gridnum .mid .a{flex:1 1 60%}
.t-gridnum .mid .b{flex:1 1 40%;color:#6d6d6d}
.t-gridnum .foot{font-size:9px;color:#6d6d6d}

/* T2 stack */
.t-stack{justify-content:center;align-items:center;text-align:center}
.t-stack .rule{position:absolute;left:9px;right:9px;top:26px;height:1px;background:#c9c6bf}
.t-stack .l1{font-size:11px;line-height:1.25}
.t-stack .l2{font-size:8.5px;line-height:1.35;color:#5f5f5f;margin-top:2px}
.t-stack .l3{font-size:7.5px;line-height:1.35;color:#9c988f;margin-top:1px}

/* T3 mono */
.t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-mono .head{font-size:9px;color:#7c7c7c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-mono .lines{margin:auto 0;font-size:9px;line-height:1.55}
.t-mono .lines span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-mono .lines .hi{color:#fff}
.t-mono .lines .lo{color:#6f6f6f}
.t-mono .caret{width:6px;height:10px;background:var(--red);display:block;flex:0 0 auto}

/* T4 alpha */
.t-alpha .abc{font-size:10px;line-height:1.35;color:#8d8a83;letter-spacing:.08em}
.t-alpha .word{margin-top:auto;font-size:12px;line-height:1.2;color:var(--ink)}
.t-alpha .sub{font-size:8.5px;color:#6d6d6d;margin-top:3px}

/* T5 plate */
.t-plate{justify-content:center;text-align:center;padding:9px 11px}
.t-plate .top{position:absolute;left:11px;right:11px;top:11px;border-top:1px solid #1a1a1a}
.t-plate .bot{position:absolute;left:11px;right:11px;bottom:11px;border-top:1px solid #1a1a1a}
.t-plate .ttl{font-size:13px;line-height:1.25;letter-spacing:-0.02em}
.t-plate .au{font-size:9px;color:#5f5f5f;margin-top:7px}
.t-plate .yr{font-size:8.5px;color:#8e8a82;margin-top:2px}

/* T6 spine */
.t-spine{flex-direction:row;align-items:stretch;justify-content:space-between;gap:6px}
.t-spine .meta{font-size:8.5px;color:#8d8d8d;line-height:1.45;flex:0 0 auto}
.t-spine .vert{writing-mode:vertical-rl;font-size:11px;line-height:1.15;align-self:flex-start;max-height:100%;overflow:hidden;flex:0 0 auto}
.t-spine .vert.accent{color:var(--red)}

/* T7 redbar */
.t-redbar .bar{background:var(--red);color:#fff;padding:8px;margin:-9px -9px 0;min-height:47%;display:flex;align-items:flex-end}
.t-redbar .bar span{font-size:12px;line-height:1.2}
.t-redbar .body{margin-top:auto;font-size:9px;line-height:1.45;color:#5f5f5f}
.t-pic{padding:0;background:#0c0c0c}
.t-pic img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.t-pic .tag{position:absolute;left:9px;top:9px;background:#000;color:#fff;font-size:9px;line-height:1;padding:3px 5px}

/* ---------- detail page ---------- */
/* 세부 페이지는 문서 스크롤을 쓰지 않는다. 화면에 고정된 무대 위에서
   휠 · 트랙패드 · 방향키 · 스와이프 입력을 JS 가 받아 도판과 글을 함께 움직인다 */
.detail{
  max-width:2400px;margin:0 auto;padding:var(--pad) 28px;
  --ease:cubic-bezier(.16,1,.3,1);      /* 빠르게 출발해 길게 감속하며 안착 */
  --ease-io:cubic-bezier(.65,0,.35,1);  /* 안내 페이드 */
  --gut:28px;                           /* 화면 양옆 여백 */
}
/* 도판 무대가 왼쪽 벽에 붙도록 왼쪽 여백은 없애고, 머리줄 · 캡션에만 여백을 준다 */
/* 오른쪽 여백(--gutR)을 넓게 둬서 글 열이 화면 끝에 붙지 않고 조금 가운데로 들어오게 */
.detail.paged{position:fixed;top:0;right:0;bottom:0;left:0;max-width:none;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;touch-action:none;padding:var(--pad) var(--gutR,var(--gut)) 0 0;--gutR:clamp(28px,7vw,150px)}
.dt-top{display:flex;align-items:baseline;justify-content:space-between;gap:0 16px;padding-bottom:30px}
.paged .dt-top{flex:0 0 auto;padding:0 0 0 var(--gut)}
.dt-meta{color:var(--dim)}
.dt-right{display:flex;align-items:baseline;gap:0 18px;min-width:0}
.dt-edit{color:var(--red)}
.dt-body{
  flex:1 1 auto;min-height:0;
  display:grid;
  /* 왼쪽 = 도판 무대(남는 폭 전부), 오른쪽 = 글 열 */
  grid-template-columns:minmax(0,1fr) clamp(320px,32vw,580px);
  grid-template-rows:minmax(0,1fr);
  gap:0 clamp(32px,4vw,80px);
  padding:2.5vh 0 3vh;
}
.dt-left{min-width:0;min-height:0;display:flex;flex-direction:column;padding-left:var(--gut)}
/* 도판 무대 : 사진은 원래 비율 그대로 무대 안에서 최대로, 무대 가운데에 둔다 */
.dt-figwrap{position:relative;flex:1 1 auto;min-height:0}
.dt-figwrap .dt-openfig{position:absolute;top:0;right:0;bottom:0;left:0}
.dt-figs{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden}
/* 도판의 투명도 · 크기 · 겹침 순서는 JS(render)가 매 프레임 직접 정한다 */
.dt-figs .fig{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transform-origin:50% 50%;will-change:opacity,transform}
/* 사진 : 틀 없이 contain. 가로 사진은 폭을, 세로 사진은 높이를 채운다 */
.t-photo{padding:0;background:none}
.t-photo img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 50%}
/* 표지 · 타이포 도판 : 원래 260px 판(137%)을 무대 높이에 맞춰 통째로 확대 (--ps 는 JS) */
.dt-figs .plate{position:absolute;left:50%;top:50%;width:260px;height:356.2px;overflow:hidden;background:var(--paper);color:var(--ink);transform:translate(-50%,-50%) scale(var(--ps,1));transform-origin:50% 50%}
/* 캡션 : 무대 아래 한 줄 */
.dt-cap{flex:0 0 auto;margin:10px 0 0;display:flex;justify-content:space-between;gap:0 12px;color:var(--dim);font-variant-numeric:tabular-nums}
.dt-cap #dtCap{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-count{flex:0 0 auto}

/* 한 단계(절)에 사진이 여러 장일 때 : 단계는 위아래로, 그 안의 사진은 좌우로 넘긴다.
   사진끼리의 교차는 단계 넘기기(JS 프레임 루프)와 따로 CSS 로 짧게 */
.t-multi img{position:absolute;top:0;left:0;opacity:0}
.t-multi img.on{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .t-multi img{transition:opacity .45s var(--ease)}
}
.dt-pn{position:absolute;top:50%;z-index:3;transform:translateY(-50%);background:#000;color:#fff;padding:6px 10px;font-size:12px;line-height:1;opacity:0}
.dt-pn-l{left:8px}
.dt-pn-r{right:8px}
.dt-figwrap:hover .dt-pn,.dt-pn:focus-visible{opacity:1}
.dt-pn:hover{background:var(--red)}
.dt-pn:disabled{opacity:0 !important;pointer-events:none}
@media (hover:none){ .dt-pn{opacity:.85} }
@media (prefers-reduced-motion:no-preference){
  .dt-pn{transition:opacity .2s ease}
}
.dt-phn{flex:0 0 auto;margin-left:auto;display:flex;align-items:baseline;gap:0 8px;color:var(--fg)}
.dt-phn button{color:var(--fg);padding:0 2px}
.dt-phn button:hover{color:var(--red)}
.dt-phn button:disabled{color:#3a3a3a;cursor:default}

/* 본문 열 : 글 전체를 한 줄기(.dt-flow)로 이어 두고, JS 가 매 프레임 transform 으로
   현재 절을 도판 옆에 데려온다. 절 밝기도 JS 가 위치에 따라 연속으로 정한다.
   아래 여백(27px)은 캡션 줄 높이 — 본문 열의 세로 중심을 도판 무대의 중심과 맞춘다 */
.dt-main{position:relative;min-width:0;height:calc(100% - 27px);overflow:hidden}
/* 열 끝에서 글이 칼같이 끊기지 않고 흐려지게 — mask 대신 배경색 그라데이션 덮개(매 프레임 비용 없음) */
.dt-main::before,.dt-main::after{content:"";position:absolute;left:0;right:0;height:28px;z-index:1;pointer-events:none}
.dt-main::before{top:0;background:linear-gradient(var(--bg),rgba(0,0,0,0))}
.dt-main::after{bottom:0;background:linear-gradient(rgba(0,0,0,0),var(--bg))}
.dt-flow{position:absolute;top:0;left:0;right:0;will-change:transform}
.dt-step{opacity:.5;cursor:pointer}
.dt-step.on{cursor:auto}
.dt-step + .dt-step{margin-top:52px}
/* 글자는 조금 작게, 자간은 좁게. 구분선은 흐린 절(투명도 0.5)에서도 보이도록 밝게.
   본문은 Pretendard Light(300), 제목만 굵게. text-wrap:pretty — 마지막 줄에 한 단어만 남지 않게 */
.dt-main h2{font-size:28px;font-weight:600;line-height:1.18;letter-spacing:-0.035em;outline:none;text-wrap:balance}
.dt-lead{font-size:16px;font-weight:300;line-height:1.62;color:#f4f4f4;margin:14px 0 0;letter-spacing:-0.022em;text-wrap:pretty}
.dt-sec h3{font-size:14px;font-weight:500;letter-spacing:-0.015em;border-top:1px solid #707070;padding-top:16px}
.dt-sec h3 .no{color:#9a9a9a;margin-right:10px;font-size:12px;letter-spacing:.06em;font-variant-numeric:tabular-nums;font-weight:300}
.dt-sec p{margin:11px 0 0;font-size:14px;font-weight:300;color:#f0f0f0;line-height:1.74;letter-spacing:-0.012em;text-wrap:pretty}
.dt-end{margin-top:40px;font-size:13px}

/* 넘기는 동안의 움직임은 전부 JS 의 프레임 루프가 맡는다 (CSS transition 없음).
   여기서는 처음 열 때의 입장만 : 글은 살짝 떠오르고, 도판은 살짝 확대된 채 안착 */
@media (prefers-reduced-motion:no-preference){
  .dt-main.enter{animation:dtIn .6s var(--ease) backwards}
  .dt-figs.enter{animation:dtFigIn .6s var(--ease) backwards}
}
@keyframes dtIn{from{opacity:0;transform:translateY(18px)}}
@keyframes dtFigIn{from{opacity:0;transform:scale(1.02)}}

/* 처음 한 번 : 아래로 넘기라는 안내 */
.dt-hint{position:absolute;z-index:3;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dim);font-size:11px;letter-spacing:.02em;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .9s var(--ease-io)}
.dt-hint.on{opacity:1}
.dt-hint-l{position:relative;display:block;width:3px;height:30px;overflow:hidden;background:linear-gradient(#2e2e2e,#2e2e2e) center/1px 100% no-repeat}
.dt-hint-l i{position:absolute;left:0;top:0;width:3px;height:9px;border-radius:2px;background:var(--fg)}
@media (prefers-reduced-motion:no-preference){
  .dt-hint-l i{animation:hintDrop 1.7s var(--ease-io) infinite}
}
@keyframes hintDrop{
  0%{transform:translateY(-10px);opacity:0}
  25%{opacity:1}
  70%{opacity:1}
  100%{transform:translateY(30px);opacity:0}
}

/* 섹션 도판(타이포 플레이트) */
.t-fig{padding:16px}
.t-fig .fp-no{font-size:56px;line-height:.85;letter-spacing:-0.045em;text-align:right}
.t-fig .fp-h{margin-top:auto;font-size:17px;line-height:1.3;letter-spacing:-0.02em}
.t-fig .fp-m{font-size:10px;color:#6d6d6d;margin-top:8px}

/* 세부 : 메타 표 · 링크 (데이터에 있을 때만 그려진다) */
.dt-mt{border-collapse:collapse;margin:18px 0 0;line-height:1.6;font-size:14px}
.dt-mt th{font-weight:400;text-align:left;color:var(--dim);padding:0 18px 0 0;vertical-align:top;white-space:nowrap}
.dt-mt td{color:#c9c9c9;padding:0}
.dt-links{border-top:1px solid var(--rule);margin-top:44px;padding-top:12px;font-size:14px}
.dt-links li{margin-top:4px}

@media (max-width:900px){
  /* 1열 : 도판 무대 위(화면 폭 전부), 본문 아래. 그래도 스크롤 없이 단계로 넘긴다 */
  .detail.paged{padding-right:0}
  .paged .dt-top{padding-right:var(--gut)}
  .dt-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46vh) minmax(0,1fr);gap:22px 0;padding:16px 0 0}
  .dt-left{padding-left:0}
  .dt-cap{padding:0 var(--gut)}
  .dt-main{height:100%;margin:0 var(--gut)}
  .dt-main h2{font-size:23px}
  .dt-lead{font-size:14px}
  .dt-sec h3,.dt-sec p{font-size:13px}
}

/* ---------- contact : 탑승권 ----------
   색인 쪽 클래스(.grid .main .top …)와 겹치지 않게 모든 이름에 tk- 를 붙인다 */
html.tk-on,html.tk-on body{overflow-x:hidden}   /* 날아가는 탑승권이 가로 스크롤을 만들지 않게 — 연락 페이지에서만 */
.tk-wrap{padding:0 0 12vh;--tk-paper:#fff}   /* 탑승권 종이만 흰색 */
.tk-wrap input,.tk-wrap select,.tk-wrap textarea{font:inherit;color:inherit;letter-spacing:inherit}
.tk-top{display:flex;align-items:baseline;gap:18px;padding-bottom:30px}
.tk-top .tk-crumb{color:var(--dim)}
.tk-top .tk-tag{margin-left:auto;color:var(--dim)}
.tk-intro{color:var(--dim);margin:6vh auto 18px;max-width:980px;outline:none}

/* 무대 */
.tk-stage{position:relative;max-width:980px;margin:0 auto}
.tk-slot{position:relative;height:12px;border-radius:6px;background:#1b1b1b;box-shadow:inset 0 -1px 0 #2c2c2c;margin:0 -10px}
.tk-slot i{position:absolute;right:16px;top:4px;width:4px;height:4px;border-radius:50%;background:#3a3a3a}
.tk-printing .tk-slot i{background:var(--red);animation:tk-blink .32s steps(1) infinite}
@keyframes tk-blink{50%{opacity:.2}}
.tk-feed{overflow:hidden;padding-bottom:20px;margin-top:-6px}
.tk-feed.tk-ready{overflow:visible}

/* 탑승권 */
.tk-ticket{position:relative;display:flex;background:transparent;color:var(--ink);transform:translateY(-104%)}
.tk-feed.tk-go .tk-ticket{animation:tk-feed 1.35s cubic-bezier(.22,.8,.24,1) .2s forwards}
@keyframes tk-feed{to{transform:translateY(0)}}

.tk-main{position:relative;flex:1 1 auto;min-width:0;background:var(--tk-paper);border-radius:10px 0 0 10px}
.tk-stub{position:relative;flex:0 0 240px;background:var(--tk-paper);border-radius:0 10px 10px 0;
  padding:18px 18px 16px 30px;display:flex;flex-direction:column}
/* 절취선 위아래의 반원 홈 */
.tk-stub::before,.tk-stub::after{content:"";position:absolute;left:-13px;width:26px;height:26px;border-radius:50%;background:var(--bg);z-index:1}
.tk-stub::before{top:-13px}
.tk-stub::after{bottom:-13px}
/* 절취선 : 점선 대신 종이를 뚫은 구멍 줄 (본체와 떼어내는 쪽 경계에 걸쳐 놓는다) */
.tk-perf{position:absolute;top:16px;bottom:16px;left:-4px;width:8px;
  background:radial-gradient(circle,var(--bg) 2.4px,transparent 2.9px) 50% 0/8px 11px repeat-y}
.tk-tear{position:absolute;left:9px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
  font-size:8.5px;letter-spacing:.24em;color:var(--lab);white-space:nowrap;pointer-events:none}

.tk-strip{display:flex;justify-content:space-between;gap:12px;background:var(--ink);color:#fff;
  padding:9px 22px;border-radius:10px 0 0 0;font-size:11px;letter-spacing:.08em}
.tk-strip b{font-weight:700}

.tk-route{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:0 18px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.tk-pt .tk-lab,.tk-f .tk-lab,.tk-stub .tk-lab{display:block;font-size:10px;letter-spacing:.06em;color:var(--lab);margin-bottom:3px}
.tk-pt b{display:block;font-size:clamp(38px,5.4vw,60px);line-height:.92;letter-spacing:-0.035em;font-weight:700;white-space:nowrap}
.tk-pt .tk-sub{display:block;font-size:12px;color:var(--lab);margin-top:5px;min-height:1.2em;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-pt.tk-r{text-align:right}
.tk-path{position:relative;height:26px;margin-bottom:22px}
.tk-path::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed #a9a497}
.tk-path svg{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);background:var(--tk-paper);padding:0 4px;box-sizing:content-box}

.tk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px;padding:16px 22px 6px}
.tk-f{display:block;min-width:0}
.tk-f.tk-w2{grid-column:span 2}
.tk-f.tk-w4{grid-column:1 / -1}
.tk-f input,.tk-f select,.tk-f textarea{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  color:var(--ink);font-size:14px;line-height:1.5;padding:3px 0 5px;border-radius:0;outline:0;resize:none}
.tk-f input::placeholder,.tk-f textarea::placeholder{color:#aaa59a}
.tk-f input:focus,.tk-f select:focus,.tk-f textarea:focus{border-bottom-color:var(--ink)}
.tk-f select{cursor:pointer;-webkit-appearance:none;appearance:none}
.tk-f .tk-ro{display:block;font-size:14px;line-height:1.5;padding:3px 0 5px;border-bottom:1px solid transparent;font-variant-numeric:tabular-nums}
.tk-f .tk-err{display:block;min-height:15px;font-style:normal;font-size:11px;color:var(--red);margin-top:3px}
.tk-f.tk-bad input,.tk-f.tk-bad textarea{border-bottom-color:var(--red)}

.tk-act{display:flex;align-items:center;gap:16px;padding:10px 22px 20px}
.tk-send{border:0;background:var(--ink);color:#fff;padding:10px 22px;font-size:13px;cursor:pointer}
.tk-send:hover{background:var(--red);color:#fff}
.tk-send:disabled{opacity:.6;cursor:default}
.tk-fine{font-size:10px;color:var(--lab);margin-left:auto;text-align:right}
.tk-fail{display:block;color:var(--red);font-size:11px;padding:0 22px 14px}

.tk-stub dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px}
.tk-stub dt{font-size:10px;letter-spacing:.06em;color:var(--lab);margin:0;padding-top:1px}
.tk-stub dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.tk-bars{display:flex;align-items:stretch;height:48px;margin-top:auto;padding-top:14px}
.tk-bars i{display:block;background:var(--ink);flex:0 0 auto}
.tk-code{margin-top:6px;font-size:10px;letter-spacing:.14em;color:var(--lab);font-variant-numeric:tabular-nums}

/* 도장 */
.tk-stamp{position:absolute;right:36px;top:46%;padding:6px 14px 5px;border:3px solid var(--red);color:var(--red);
  font-size:24px;font-weight:700;letter-spacing:.12em;text-align:center;line-height:1;border-radius:4px;
  opacity:0;transform:rotate(-12deg) scale(1.9);pointer-events:none;mix-blend-mode:multiply}
.tk-stamp small{display:block;font-size:10px;letter-spacing:.3em;margin-top:4px}
.tk-stamped .tk-stamp{animation:tk-stamp .34s cubic-bezier(.2,1.5,.45,1) forwards}
@keyframes tk-stamp{to{opacity:.92;transform:rotate(-12deg) scale(1)}}
.tk-stamped .tk-main{animation:tk-thump .26s ease-out .12s}
@keyframes tk-thump{40%{transform:translateY(3px) scale(.996)}}

/* 떼어내고 날려 보내기 */
.tk-stub{transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.tk-torn .tk-stub{transform:translate(20px,8px) rotate(3.5deg)}
.tk-main{transition:transform 1.05s cubic-bezier(.6,.04,.98,.34),opacity .8s ease-in .2s}
.tk-flown .tk-main{transform:translate(70vw,-80vh) rotate(-16deg) scale(.4);opacity:0}

.tk-sky{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;transition:opacity .6s ease}
.tk-sky circle{fill:var(--dim)}
.tk-sky .tk-pl{fill:var(--fg)}

.tk-done{position:absolute;left:0;top:0;bottom:0;right:250px;display:flex;flex-direction:column;justify-content:center;
  padding:0 8px;opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease;pointer-events:none}
.tk-landed .tk-done{opacity:1;transform:none;pointer-events:auto}
.tk-done h2{font-size:clamp(26px,3.4vw,42px);line-height:1.1;letter-spacing:-0.03em;margin:0;color:var(--fg)}
.tk-done p{color:var(--dim);margin:12px 0 0;font-size:13.5px;line-height:1.7;max-width:44ch}
.tk-done .tk-again{margin-top:20px;color:var(--fg)}

.tk-alt{max-width:980px;margin:34px auto 0;color:var(--dim);display:flex;flex-wrap:wrap;gap:0 20px}

/* 좁은 화면 : 떼어내는 쪽이 아래로 */
@media (max-width:760px){
  .tk-ticket{flex-direction:column}
  .tk-main{border-radius:10px 10px 0 0}
  .tk-strip{border-radius:10px 10px 0 0}
  .tk-stub{flex-basis:auto;border-radius:0 0 10px 10px;padding-left:18px}
  .tk-stub::before{left:-13px;top:-13px}
  .tk-stub::after{left:auto;right:-13px;top:-13px;bottom:auto}
  .tk-perf{top:-4px;bottom:auto;left:16px;right:16px;width:auto;height:8px;background-size:11px 8px;background-repeat:repeat-x;background-position:0 50%}
  .tk-tear{display:none}
  .tk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tk-f.tk-w2{grid-column:1 / -1}
  .tk-fine{display:none}
  .tk-torn .tk-stub{transform:translate(6px,22px) rotate(2deg)}
  .tk-done{right:0;bottom:auto;height:auto;top:0;padding-top:40px}
}

@media (prefers-reduced-motion:reduce){
  .tk-ticket{transform:none}
  .tk-feed.tk-go .tk-ticket{animation:none}
  .tk-main,.tk-stub,.tk-done{transition:none}
  .tk-stamped .tk-main{animation:none}
}

/* ---------- detail : 전체 화면 트리거 ---------- */
.dt-openfig{display:block;position:relative;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left;cursor:zoom-in}
.dt-zoom{position:absolute;right:8px;bottom:8px;background:#000;color:#fff;padding:2px 7px;font-size:10px;letter-spacing:.02em;opacity:0}
.dt-openfig:hover .dt-zoom,.dt-openfig:focus-visible .dt-zoom{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .dt-zoom{transition:opacity .2s ease}
}

/* ---------- detail : 도판 전체 화면 뷰어 ---------- */
.viewer{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:#000;display:flex;flex-direction:column;overflow:hidden}
.vw-top{flex:0 0 auto;display:flex;align-items:baseline;gap:16px;padding:18px 22px 0}
.vw-id{flex:0 0 auto;color:var(--dim);font-variant-numeric:tabular-nums}
.vw-lead{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw-close{flex:0 0 auto;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px}
.vw-close:hover{color:var(--red);text-decoration-color:var(--red)}
.vw-stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:16px 22px;min-height:0;cursor:zoom-out}
/* 프레임은 뷰포트 기준 비율 박스, 판은 기준 크기(260px)를 scale 로 비례 확대 */
.vw-frame{display:block;position:relative;width:min(calc(100vw - 44px),calc((100vh - 168px)/1.37));height:0;padding-top:137%;overflow:hidden;background:var(--paper);color:var(--ink);cursor:default}
.vw-plate{position:absolute;top:0;left:0;width:260px;height:356.2px;transform-origin:0 0;background:var(--paper);color:var(--ink)}
.vw-foot{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 22px 20px}
.vw-info{min-height:32px;max-width:46ch}
.vw-info .t{font-size:15px;line-height:1.25}
.vw-info .m{color:var(--dim);margin-top:3px}
.vw-nav{flex:0 0 auto;display:flex;align-items:baseline;gap:0 14px;color:var(--dim)}
.vw-nav button{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px;color:var(--dim)}
.vw-nav button:hover{color:var(--red);text-decoration-color:var(--red)}
.vw-nav button[disabled]{color:#3a3a3a;text-decoration:none;cursor:default}
.vw-count{font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .vw-lead{display:none}
  .vw-foot{flex-wrap:wrap;gap:12px 24px}
}

/* ---------- load-in ---------- */
@media (prefers-reduced-motion:no-preference){
  .item{animation:rise .34s cubic-bezier(.2,.6,.2,1) both}
}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}
@media (max-width:820px){
  .page{
    grid-template-columns:minmax(0,1fr);

}

  .tally{margin-left:0;padding-left:0;width:100%}
}


/* ================= 꺼내보기 트리거 ================= */
.pullout{display:flex;align-items:center;gap:9px;margin:0 0 16px}
.pull-bars{display:flex;align-items:flex-end;gap:2px;height:16px;flex:0 0 auto}
.pull-bars i{display:block;width:2px;height:16px;background:#565656}
.pull-link{font-size:15px;line-height:1.2;letter-spacing:-0.012em;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:.5px}
.pullout:hover .pull-link{color:var(--red);text-decoration-color:var(--red)}
.pullout:hover .pull-bars i{background:var(--red)}
@media (prefers-reduced-motion:no-preference){
  .pull-bars i{transition:transform .28s cubic-bezier(.2,.7,.2,1),background .28s ease}
  .pullout:hover .pull-bars i:nth-child(1){transform:translate(-4px,4px)}
  .pullout:hover .pull-bars i:nth-child(2){transform:translate(-2px,2px)}
  .pullout:hover .pull-bars i:nth-child(4){transform:translate(2px,-2px)}
  .pullout:hover .pull-bars i:nth-child(5){transform:translate(4px,-4px)}
}

/* ================= shelf 오버레이 (직교투영 3D) ================= */
[hidden]{display:none!important}
.shelf{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:#000;display:flex;flex-direction:column;overflow:hidden}
.sh-top{display:flex;align-items:baseline;gap:16px;padding:18px 22px 0;flex:0 0 auto;position:relative;z-index:5}
.sh-date{flex:0 0 120px;color:var(--dim);font-variant-numeric:tabular-nums}
.sh-lead{flex:1;text-align:center}
.sh-close{flex:0 0 auto;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px}
.sh-close:hover{color:var(--red);text-decoration-color:var(--red)}

.sh-stage{position:relative;flex:1 1 auto;overflow:hidden;cursor:ew-resize;touch-action:none}
.sh-stage.pinned{cursor:default}

/* perspective 를 주지 않아 소실점이 없는 평행(직교) 투영이 된다.
   움직임은 CSS transition 없이 JS 프레임 루프가 매 프레임 transform 을 정한다 */
.sh-rack{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}

/* 낱장 = 줄에 꽂힌 카세트테이프 케이스. z-index 를 쓰지 않고 3D 깊이로 가림 처리
   앞면  : 어두운 투명 플라스틱 케이스 속 J카드(표지) + 왼쪽 경첩 + 비스듬한 광택
   오른쪽: J카드 등(제목 · 품번), 위: 케이스 윗면 — 꽂혀 있을 때 보이는 두 면 */
.slab{position:absolute;padding:0;border:0;background:none;cursor:pointer;transform-style:flat;backface-visibility:hidden}
.slab .face{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;border-radius:3px;
  background:linear-gradient(160deg,#303030,#141414 55%,#1d1d1d);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 0 0 3px rgba(0,0,0,.6)}
.slab .jcard{position:absolute;top:4.5%;bottom:4.5%;left:12%;right:4.5%;overflow:hidden;background:var(--paper);color:var(--ink);border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.slab .hinge{position:absolute;top:0;bottom:0;left:0;width:12%;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 55%,rgba(0,0,0,.35))}
.slab .hinge::before,.slab .hinge::after{content:"";position:absolute;left:26%;width:48%;height:6%;border-radius:2px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.slab .hinge::before{top:11%}
.slab .hinge::after{bottom:11%}
.slab .gloss{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.07) 20%,rgba(255,255,255,0) 33%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08) 83%,rgba(255,255,255,0) 100%)}
.slab .spine{position:absolute;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0 8px;overflow:hidden;border-radius:0 3px 3px 0}
/* 등 위의 투명 플라스틱 : 가장자리 하이라이트와 그늘 */
.slab .spine::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.22));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 4px 0 rgba(255,255,255,.06),inset 0 -4px 0 rgba(0,0,0,.18)}
.slab .sp-t{writing-mode:vertical-rl;font-size:9px;font-weight:600;line-height:1;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;max-height:76%}
.slab .sp-k{writing-mode:vertical-rl;font-size:7px;line-height:1;letter-spacing:.14em;opacity:.7;white-space:nowrap}
.slab .edge{position:absolute;top:0;left:0;right:0;border-radius:3px 3px 0 0;background:linear-gradient(#3e3e3e,#1c1c1c);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1px rgba(255,255,255,.1)}
.slab .edge i{position:absolute;left:7%;right:7%;height:1px;background:rgba(255,255,255,.12)}
.slab:focus-visible{outline:1px solid var(--red);outline-offset:3px}

.sh-tick{position:absolute;font-size:10px;color:#6d6d6d;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.sh-tick::before{content:"";position:absolute;top:-10px;left:0;width:1px;height:7px;background:#3b3b3b}

.sh-tags{position:absolute;right:22px;top:50%;transform:translateY(-50%);text-align:right;pointer-events:none;z-index:6}
.sh-tags li{font-size:10px;line-height:1.65;color:#4a4a4a}
.sh-tags li.on{color:#fff}
.sh-tags .n{font-size:7px;vertical-align:super;margin-left:3px;color:#3f3f3f}
.sh-tags li.on .n{color:var(--red)}

.sh-foot{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 22px 20px;position:relative;z-index:5}
.sh-info{min-height:44px;max-width:46ch}
.sh-info .t{font-size:15px;line-height:1.25}
.sh-info .m{color:var(--dim);margin-top:3px}
.sh-hint{color:#585858;text-align:right;flex:0 0 auto}
.sh-hint .on{color:var(--red)}

/* 처음 열 때 하나씩 나타난다. 등 · 윗면의 투명도는 JS 가 정하므로 케이스(.slab) 째로 페이드 */
@media (prefers-reduced-motion:no-preference){
  .slab{animation:slabIn .6s cubic-bezier(.2,.7,.2,1) both}
}
@keyframes slabIn{from{opacity:0}to{opacity:1}}

@media (max-width:820px){
  .sh-tags,.sh-hint{display:none}
  .sh-lead{text-align:left}
}
</style>

<body>
<div class="page">

  <header class="masthead">

let LANG = (function(){
  try { const s = localStorage.getItem('archive-lang'); if (s === 'ko' || s === 'en') return s; } catch (e) {}
  return /^ko/i.test(navigator.language || '') ? 'ko' : 'en';
})();
function t(k, v){
  let s = L[LANG][k] != null ? L[LANG][k] : L.ko[k];
  if (v && typeof s === 'string') Object.keys(v).forEach(function(n){ s = s.split('{' + n + '}').join(v[n]); });
  return s;
}
const CAT = {};
function applyStatic(){
  document.documentElement.lang = LANG;
  if (document.getElementById('detail').hidden) document.title = t('docTitle');
  ['research', 'activity', 'dev', 'read'].forEach(function(c){ CAT[c] = t('cat_' + c); });
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)); });
}

/* 글 내용 : data.json 원본(RAW)에 en 이 있으면 그 언어로 덮어쓴 사본을 ITEMS · DETAIL 로 쓴다
   item.en   = {title, sub, meta, tags}
   detail.en = {lede, sections:[{h, p}]} — sections 와 같은 순서. 사진 캡션은 절 제목을 따른다 */
let RAW = {items:[], detail:{}};
function locItem(it){
  const e = LANG === 'en' && it.en;
  if (!e) return it;
  const o = Object.assign({}, it);
  ['title', 'sub', 'meta', 'tags'].forEach(function(k){ if (e[k]) o[k] = e[k]; });
  return o;
}
function locDetail(d){
  const e = LANG === 'en' && d && d.en;
  if (!e) return d;
  const o = Object.assign({}, d), es = e.sections || [];
  if (e.lede){ o.lede = e.lede; delete o.lead; }
  o.figures = (d.figures || []).map(function(f){ return Object.assign({}, f); });
  o.sections = (d.sections || []).map(function(s, i){
    const x = es[i] || {}, r = Object.assign({}, s);
    if (x.h) r.h = x.h;
    if (x.p && x.p.length) r.p = x.p;
    if (x.h) (Array.isArray(s.figs) ? s.figs : typeof s.fig === 'number' ? [s.fig] : []).forEach(function(n){ if (o.figures[n]) o.figures[n].cap = x.h; });
    return r;
  });
  return o;
}
function localize(){
  ITEMS = RAW.items.map(locItem);
  DETAIL = {};
  Object.keys(RAW.detail).forEach(function(id){ DETAIL[id] = locDetail(RAW.detail[id]); });
}
const onLang = [];
function setLang(l){
  if (l === LANG) return;
  LANG = l;
  try { localStorage.setItem('archive-lang', l); } catch (e) {}
  applyStatic();
  localize();
  onLang.forEach(function(f){ f(); });
}
document.querySelectorAll('[data-lang]').forEach(function(b){
  b.addEventListener('click', function(){ setLang(b.dataset.lang); });
});
applyStatic();

/* 관리자(글쓰기) 화면. 올리기는 서버가 있는 Vercel 에서만 되므로 다른 주소(GitHub Pages)에서는 Vercel 로 보낸다 */

  ? 'admin.html' : 'https://archive-gamma-snowy.vercel.app/admin.html';

/* admin 에서 들어온 같은 탭이면 비밀번호가 기억돼 있다 → 세부 페이지에 '수정' 링크 */
function adminIn(){ try { return !!sessionStorage.getItem('archive-key'); } catch (e) { return false; } }

/* 연락(탑승권) 설정
   web3formsKey 가 비어 있으면 : 애니메이션 뒤 메일 앱(mailto)을 연다
   web3formsKey 를 넣으면     : 메일 앱 없이 바로 메일로 전송된다
   (키 발급 : https://web3forms.com 에서 받는 메일 주소만 입력)
   연락 종류(게이트) 목록은 위 L 사전의 gates (한국어 · 영어) 에서 고친다 */
const CONTACT = {
  to: 'hanjiwoong0105@naver.com',
  web3formsKey: ''
};

let ITEMS = [];
let DETAIL = {};

/* ========================= covers ========================= */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parts = d => ({y4:d.slice(0,4), y:d.slice(2,4), m:d.slice(5,7), d:d.slice(8,10)});
/* 날짜 글자 : 기간 프로젝트(dateEnd)는 '2024.03.01 – 2024.06.30'. 연도 묶음은 늘 시작 날짜(date)를 따른다 */
const when = it => it.date.replace(/-/g, '.') + (it.dateEnd ? ' – ' + it.dateEnd.replace(/-/g, '.') : '');

function cover(it){
  const t = esc(it.title), s = esc(it.sub), m = esc(it.meta), k = esc(CAT[it.cat]);
  const p = parts(it.date);
  const num = (it.id.match(/\d+/) || ['0'])[0];

  switch(it.cover){
    /* 대표 사진 표지 (admin 에서 고른 사진 — coverSrc) */
    case 'photo': if (!it.coverSrc) return cover(Object.assign({}, it, {cover:'gridnum'}));
      return '<div class="cv t-pic">'
      + '<img src="' + esc(it.coverSrc) + '" alt="" loading="lazy" decoding="async">'
      + '<span class="tag">' + k + ' ' + num + '</span>'
      + '</div>';

    case 'gridnum': return '<div class="cv t-gridnum">'
      + '<div class="row"><span class="kick">' + k + '<br>' + s + '</span><span class="no">' + num + '</span></div>'
      + '<div class="mid"><span class="a">' + t + '</span><span class="b">' + m + '</span></div>'
      + '<div class="foot">' + p.m + ' · ' + p.y + '</div>'
      + '</div>';

    case 'stack': return '<div class="cv t-stack">'
      + '<div class="rule"></div>'
      + '<div class="l1">' + t + '</div>'
      + '<div class="l2">' + s + '</div>'
      + '<div class="l3">' + k + ' ' + m + '</div>'
      + '<div class="l3">' + k + ' ' + m + '</div>'
      + '</div>';

    case 'mono': return '<div class="cv t-mono dark">'
      + '<div class="head">~/' + m + '</div>'
      + '<div class="lines">'
      +   '<span class="hi">' + t + '</span>'
      +   '<span class="lo">' + s + '</span>'
      +   '<span class="lo">' + esc(it.tags) + '</span>'
      +   '<span class="lo">— ' + p.m + '/' + p.y + '</span>'
      + '</div>'
      + '<span class="caret" aria-hidden="true"></span>'
      + '</div>';

    case 'alpha': return '<div class="cv t-alpha">'
      + '<div class="abc">a bcd<br>e fgh<br>i jkl<br>m no<br>p qrs<br>t uv<br>w xyz</div>'
      + '<div class="word">' + t + '</div>'
      + '<div class="sub">' + k + ' ' + m + ' / ' + p.m + '.' + p.y + '</div>'
      + '</div>';

    case 'plate': return '<div class="cv t-plate">'
      + '<div class="top"></div>'
      + '<div class="ttl">' + t + '</div>'
      + '<div class="au">' + s + '</div>'
      + '<div class="yr">' + m + '</div>'
      + '<div class="bot"></div>'
      + '</div>';

    case 'spine': return '<div class="cv t-spine dark">'
      + '<div class="meta">' + k + '<br>' + p.m + '.' + p.y + '<br>' + m + '</div>'
      + '<div class="vert' + (it.cat === 'read' ? ' accent' : '') + '">' + t + '</div>'
      + '</div>';

    case 'redbar': return '<div class="cv t-redbar">'
      + '<div class="bar"><span>' + t + '</span></div>'
      + '<div class="body">' + k + ' / ' + m + '<br>' + s + '<br>' + p.m + '.' + p.y + '</div>'
      + '</div>';
  }
  return '';
}

/* =========================================================
   BOOT — data.json 을 읽은 뒤 한 번 실행된다 (맨 아래 fetch 참고).
   렌더 · 선반 · 세부/라우터 전부 이 함수 안에 있다.
   ========================================================= */
function boot(){

/* ========================= render ========================= */
const out = document.getElementById('out');
const tally = document.getElementById('tally');
const state = {cat:'all', q:''};

function card(it, i){
  const p = parts(it.date), e = it.dateEnd && parts(it.dateEnd);
  const end = !e ? '' : '–' + (e.y4 !== p.y4 ? e.y + '.' : '') + e.m + '.' + e.d;
  return '<a class="item" href="#' + it.id + '" style="animation-delay:' + (Math.min(i,24) * 16) + 'ms">'
    + '<span class="frame">' + cover(it) + '</span>'
    + '<span class="cap"><span class="t">' + esc(it.title) + '</span><span class="n">' + p.m + '.' + p.d + end + '</span></span>'
    + '</a>';
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  let list = ITEMS.filter(function(it){
    const inCat = state.cat === 'all' || it.cat === state.cat;
    const hay = (it.title + ' ' + it.sub + ' ' + it.meta + ' ' + it.tags + ' ' + CAT[it.cat]).toLowerCase();
    return inCat && (!q || hay.indexOf(q) !== -1);
  });
  list.sort((a,b) => b.date.localeCompare(a.date));
  return list;
}

function render(){
  const list = filtered();
  tally.textContent = t('count', {n:list.length});

  if (!list.length){
    out.innerHTML = '<p class="empty"><b>' + t('emptyB') + '</b>' + t('emptyT') + '</p>';
    return;
  }

  const years = [];
  list.forEach(it => { const y = it.date.slice(0,4); if (years.indexOf(y) === -1) years.push(y); });

  let n = 0;
  out.innerHTML = years.map(function(y){
    const rows = list.filter(it => it.date.slice(0,4) === y).map(it => card(it, n++)).join('');
    return '<section class="year"><h3>' + y + '</h3><div class="grid">' + rows + '</div></section>';
  }).join('');
}

function renderUpdates(){
  const recent = ITEMS.slice().sort((a,b) => b.date.localeCompare(a.date)).slice(0,5);
  document.getElementById('updates').innerHTML = recent.map(function(it){
    const p = parts(it.date);
    return '<li><span class="d">' + p.d + '.' + p.m + '.' + p.y + '</span>'
      + '<a href="#' + it.id + '">' + esc(it.title) + '</a></li>';
  }).join('');
}

document.querySelectorAll('[data-cat]').forEach(function(b){
  b.addEventListener('click', function(){
    state.cat = b.dataset.cat;
    document.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
});

let timer;
document.getElementById('q').addEventListener('input', function(e){
  clearTimeout(timer);
  const v = e.target.value;
  timer = setTimeout(function(){ state.q = v; render(); }, 120);
});

renderUpdates();
render();
onLang.push(function(){ renderUpdates(); render(); });

/* =========================================================
   SHELF — 직교투영 3D 선반
   카메라: rotateX(-32deg) rotateY(38deg), perspective 없음
     · 세로선은 수직 유지
     · 줄(world X)은 화면상 왼쪽 아래 → 오른쪽 위
     · +X 가 시점에서 멀어지므로 앞쪽(왼쪽 아래) 장이 뒤를 가린다
   ========================================================= */
(function(){
  var shelf  = document.getElementById('shelf');
  var stage  = document.getElementById('shStage');
  var rack   = document.getElementById('shRack');
  var info   = document.getElementById('shInfo');
  var dateEl = document.getElementById('shDate');
  var tagsEl = document.getElementById('shTags');
  var hintEl = document.getElementById('shHint');
  var openBtn  = document.getElementById('openShelf');
  var closeBtn = document.getElementById('shClose');

  var RX = -32, RY = 38;                 // 카메라 각도
  var CAM  = 'rotateX(' + RX + 'deg) rotateY(' + RY + 'deg)';
  var BILL = 'rotateY(' + (-RY) + 'deg) rotateX(' + (-RX) + 'deg)';  // 카메라 상쇄(정면 고정)

  var list = [], active = 0, pinned = false, dragging = false;
  var W = 0, H = 0, STEP = 26, GAP = 46, PULL = 0, LIFT = 0, SPINE = 38, EDGE = 30, TURN = 24;

  /* 카세트 J카드 비율(세로로 긴 64:100)에 두툼한 케이스 */
  function dims(){
    H     = Math.max(190, Math.min(330, Math.round(window.innerHeight * 0.38)));
    W     = Math.round(H / 1.56);
    STEP  = Math.round(H * (window.innerWidth < 640 ? 0.085 : 0.11));
    SPINE = Math.round(STEP * 1.45);
    EDGE  = Math.round(STEP * 1.05);
    GAP   = Math.round(STEP * 1.9);
    PULL  = Math.round(STEP * 1.7);
    LIFT  = Math.round(H * 0.78);
  }

  /* J카드 등 색 : 분류마다 [바탕, 글자] */
  var SPINE_C = {research:['#ebe9e3', '#141414'], activity:['#e0301e', '#fff'], dev:['#151515', '#e6e6e6'], read:['#d8d2c4', '#141414']};

  function build(){
    dims();
    list = ITEMS.slice().sort(function(a, b){ return a.date.localeCompare(b.date); });

    var html = '', lastYear = '';

    list.forEach(function(it, i){
      var c = SPINE_C[it.cat] || SPINE_C.research;

      html += '<button class="slab" type="button" data-i="' + i + '"'
           +  ' aria-label="' + esc(it.title) + '"'
           +  ' style="left:' + (-W / 2) + 'px;top:' + (-H / 2) + 'px;'
           +  'width:' + W + 'px;height:' + H + 'px;'
           +  'animation-delay:' + Math.min(i * 30, 700) + 'ms">'
           +  '<span class="face"><span class="jcard">' + cover(it) + '</span>'
           +    '<span class="hinge"></span><span class="gloss"></span></span>'
           +  '<span class="edge" style="height:' + EDGE + 'px">'
           +    '<i style="top:' + Math.round(EDGE * 0.38) + 'px"></i>'
           +    '<i style="top:' + Math.round(EDGE * 0.66) + 'px"></i>'
           +  '</span>'
           +  '<span class="spine" style="width:' + SPINE + 'px;background:' + c[0] + ';color:' + c[1] + '">'
           +    '<span class="sp-t">' + esc(it.title) + '</span>'
           +    '<span class="sp-k">' + esc(it.id.toUpperCase()) + '</span></span>'
           +  '</button>';

      var y = it.date.slice(0, 4);
      if (y !== lastYear){
        lastYear = y;
        html += '<span class="sh-tick" data-x="' + (i * STEP) + '" style="left:0;top:'
             +  Math.round(H / 2 + 26) + 'px;transform:translateX(' + (i * STEP) + 'px) ' + BILL + '">'
             +  y + '</span>';
      }
    });

    rack.innerHTML = html;
    slabs = [].slice.call(rack.querySelectorAll('.slab')).map(function(el){
      return { el:el, i:+el.dataset.i, sp:el.querySelector('.spine'), ed:el.querySelector('.edge'), key:'' };
    });
  }

  /* pos(실수) 하나로 선반 전체를 그린다. 모든 값이 pos 의 연속 함수라 빨리 넘겨도 끊기지 않는다
     · 꺼낸 정도 p : pos 에 가까운 케이스일수록 1 — 위로 들리며 앞으로 나오고, 살짝 내 쪽으로 돈다
     · 비켜서기 g  : 꺼낸 케이스 뒤쪽은 그 자리만큼 물러난다 (빈자리가 물결처럼 옮겨 다님)
     · 등 · 윗면은 꺼낸 만큼 흐려져 케이스 앞면(J카드)이 드러난다 */
  var slabs = [], pos = 0, target = 0, raf2 = 0, lastT = 0, TAU = 0.14;
  var still = window.matchMedia('(prefers-reduced-motion: reduce)');
  function smooth(t){ return t * t * (3 - 2 * t); }
  function layout(){
    rack.style.transform = CAM + ' translateX(' + (-(pos * STEP)).toFixed(2) + 'px)';
    for (var k = 0; k < slabs.length; k++){
      var s = slabs[k], d = s.i - pos, a = Math.abs(d);
      var p = a < 1 ? smooth(1 - a) : 0;
      var g = d > 0 ? smooth(Math.min(1, d)) : 0;
      var tf = 'translateX(' + (s.i * STEP + GAP * g - PULL * p).toFixed(2) + 'px) translateY(' + (-LIFT * p).toFixed(2)
             + 'px) rotateY(' + (-90 + TURN * p).toFixed(2) + 'deg)';
      if (tf === s.key) continue;
      s.key = tf;
      s.el.style.transform = tf;
      s.sp.style.opacity = s.ed.style.opacity = (1 - p).toFixed(3);
    }
  }
  /* 지수 감속 추종 — 세부 페이지와 같은 방식 */
  function tick(t){
    var dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 1 / 60;
    lastT = t;
    pos += (target - pos) * (1 - Math.exp(-dt / TAU));
    if (Math.abs(target - pos) < 0.001) pos = target;
    layout();
    if (pos !== target) raf2 = requestAnimationFrame(tick);
    else { raf2 = 0; lastT = 0; }
  }
  function glide(){
    if (still.matches){ pos = target; layout(); return; }
    if (!raf2) raf2 = requestAnimationFrame(tick);
  }

  function paintInfo(){
    var it = list[active];
    if (!it) return;
    info.innerHTML = '<div class="t">' + esc(it.title) + '</div>'
                   + '<div class="m">' + esc(CAT[it.cat]) + ' · ' + esc(it.sub)
                   + ' · ' + when(it) + ' · ' + esc(it.meta) + '</div>';
    dateEl.textContent = it.date.replace(/-/g, '.') + '   ' + (active + 1) + ' / ' + list.length;
    markTags(it);
  }

  function paintHint(){
    hintEl.innerHTML = t(pinned ? 'shPinned' : 'shFree');
  }

  function setActive(i){
    i = Math.max(0, Math.min(list.length - 1, i));
    if (i === active) return;
    active = target = i;
    glide();
    paintInfo();
  }

  function buildTags(){
    var freq = {};
    ITEMS.forEach(function(it){
      it.tags.split(/\s+/).forEach(function(t){ if (t) freq[t] = (freq[t] || 0) + 1; });
    });
    var top = Object.keys(freq).sort(function(a, b){
      return freq[b] - freq[a] || a.localeCompare(b);
    }).slice(0, 12);
    tagsEl.innerHTML = '<ul>' + top.map(function(t){
      return '<li data-t="' + esc(t) + '">' + esc(t) + '<span class="n">' + freq[t] + '</span></li>';
    }).join('') + '</ul>';
  }

  function markTags(it){
    var set = it ? it.tags.split(/\s+/) : [];
    tagsEl.querySelectorAll('li').forEach(function(li){
      li.classList.toggle('on', set.indexOf(li.dataset.t) !== -1);
    });
  }

  var pendingX = null, raf = 0;
  function scrub(){
    raf = 0;
    if (pendingX === null) return;
    var r = stage.getBoundingClientRect();
    var t = (pendingX - r.left) / r.width;
    t = Math.max(0, Math.min(1, t));
    setActive(Math.round(t * (list.length - 1)));
    pendingX = null;
  }
  function queue(x){
    pendingX = x;
    if (!raf) raf = requestAnimationFrame(scrub);
  }

  stage.addEventListener('pointermove', function(e){
    if (pinned && !dragging) return;
    queue(e.clientX);
  });
  stage.addEventListener('pointerdown', function(e){ dragging = true; queue(e.clientX); });
  window.addEventListener('pointerup', function(){ dragging = false; });

  stage.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.slab') : null;
    if (b) setActive(+b.dataset.i);
    pinned = !pinned;
    stage.classList.toggle('pinned', pinned);
    paintHint();
  });

  document.addEventListener('keydown', function(e){
    if (shelf.hidden) return;
    if (e.key === 'Escape'){ closeShelf(); return; }
    var d = 0;
    if (e.key === 'ArrowRight') d = 1;
    else if (e.key === 'ArrowLeft') d = -1;
    else if (e.key === 'Home'){ e.preventDefault(); pin(); setActive(0); return; }
    else if (e.key === 'End'){ e.preventDefault(); pin(); setActive(list.length - 1); return; }
    if (!d) return;
    e.preventDefault();
    pin();
    setActive(active + d);
  });

  function pin(){
    pinned = true;
    stage.classList.add('pinned');
    paintHint();
  }

  function openShelf(){
    build();
    buildTags();
    active = Math.floor((ITEMS.length - 1) / 2);
    pos = target = active;
    pinned = false;
    stage.classList.remove('pinned');
    shelf.hidden = false;
    document.body.style.overflow = 'hidden';
    layout();
    paintInfo();
    paintHint();
    closeBtn.focus();
  }

  function closeShelf(){
    shelf.hidden = true;
    document.body.style.overflow = '';
    openBtn.focus();
  }

  openBtn.addEventListener('click', openShelf);
  closeBtn.addEventListener('click', function(e){ e.stopPropagation(); closeShelf(); });

  var rt;
  window.addEventListener('resize', function(){
    if (shelf.hidden) return;
    clearTimeout(rt);
    rt = setTimeout(function(){ var keep = active; build(); active = keep; pos = target = keep; layout(); paintInfo(); }, 180);
  });

  /* 언어를 바꾸면 열려 있는 선반을 그 언어로 다시 */
  onLang.push(function(){
    if (shelf.hidden) return;
    var keep = active;
    build(); buildTags();
    active = keep; pos = target = keep;
    layout(); paintInfo(); paintHint();
  });
})();


/* =========================================================
   DETAIL — 세부 페이지
   해시가 항목 id(#r-014 …)면 세부, 그 외에는 카테고리를 보여준다.
   세부 페이지는 스크롤하지 않고 '단계'로 넘긴다. 단계 0 = 표지 + 머리말,
   단계 n = n번째 절. 도판과 글이 같은 순간에 함께 바뀐다.
   화면보다 긴 절은 같은 절 안에서 나눠 내려간 뒤 다음 절로 넘어간다.
   DETAIL 에 없는 항목은 ITEMS 데이터로 최소 페이지를 생성(fallback).
   머리말은 lede(admin 형식) 또는 lead(기존 형식). 절에 fig 가 있고
   figures[fig].src 가 있으면 타이포 도판 대신 그 사진을 쓴다.
   절에 figs(번호 배열)가 있으면 그 단계 안에서 사진 여러 장을 좌우로 넘긴다
   (← → 키 · 가로 스와이프 · 트랙패드 가로 밀기 · 도판 양옆 버튼).
   ========================================================= */
(function(){
  var pageEl   = document.querySelector('.page');
  var detailEl = document.getElementById('detail');
  /* 연락 페이지는 같은 컨테이너를 innerHTML 로 덮어쓰므로 원래 껍데기를 보관해 둔다 */
  var detailShell = detailEl.innerHTML;
  var mode = 'article';
  var figsEl   = document.getElementById('dtFigs');
  var capEl    = document.getElementById('dtCap');
  var mainEl   = document.getElementById('dtMain');
  var metaEl   = document.getElementById('dtMeta');
  var countEl  = document.getElementById('dtCount');
  var hintEl   = document.getElementById('dtHint');
  var plates = [], activeFig = 0, cur = null, capBase = '';
  /* views : 전체 화면 뷰어가 한 장씩 넘기는 목록. 여러 장짜리 단계는 사진마다 하나씩 펼친다
     views[n] = {html, label, k(단계), j(그 단계 안의 사진)} */
  var views = [];
  /* 단계 상태
     steps[k] = {el, stops[]}  : 단계(머리말 · 절)와 그 단계에서 글 줄기를 놓을 세로 위치들
     path[i]  = {k, y}         : 모든 정지점을 순서대로 펼친 길. pos · target 은 이 길 위의 실수 위치
     입력은 target 을 움직이고, 화면(pos)은 매 프레임 target 을 지수 감속으로 따라간다 */
  var steps = [], path = [], figEls = [], pos = 0, target = 0, shown = -1;
  var hintTimer = 0, flowEl = null;

  function nn(i){ return (i < 10 ? '0' : '') + i; }

  function figPlate(it, i, heading){
    return '<div class="cv t-fig' + (i % 2 ? ' dark' : '') + '">'
      + '<div class="fp-no">' + nn(i) + '</div>'
      + '<div class="fp-h">' + esc(heading) + '</div>'
      + '<div class="fp-m">' + esc(it.title) + ' — ' + esc(CAT[it.cat]) + '</div>'
      + '</div>';
  }

  function photoPlate(f, alt){
    return '<div class="cv t-photo"><img src="' + esc(f.src) + '" alt="' + esc(alt) + '" decoding="async"></div>';
  }

  /* 여러 장 : 같은 자리에 겹쳐 두고 .on 인 한 장만 보인다 */
  function multiPlate(list, alt){
    return '<div class="cv t-photo t-multi">' + list.map(function(f, j){
      return '<img' + (j ? '' : ' class="on"') + ' src="' + esc(f.src) + '" alt="' + esc(alt + ' (' + (j + 1) + '/' + list.length + ')') + '" decoding="async">';
    }).join('') + '</div>';
  }

  /* 절의 사진들 : figs(배열) 또는 fig(번호 하나) */
  function photosOf(s, figures){
    var nums = Array.isArray(s.figs) ? s.figs : typeof s.fig === 'number' ? [s.fig] : [];
    return nums.map(function(n){ return figures[n]; }).filter(function(f){ return f && f.src; });
  }

  /* ---- 한 단계 안에서 사진 넘기기 ---- */
  function multiAt(k){ var p = plates[k]; return !!(p && p.photos && p.photos.length > 1); }

  function setSub(k, j){
    var p = plates[k];
    if (!multiAt(k)) return;
    j = Math.max(0, Math.min(p.photos.length - 1, j));
    if (j === p.sub) return;
    p.sub = j;
    var imgs = figEls[k] ? figEls[k].querySelectorAll('.t-multi img') : [];
    for (var n = 0; n < imgs.length; n++) imgs[n].classList.toggle('on', n === j);
    if (k === shown) paintPh(k);
  }
  function flip(d){
    if (shown < 0 || !multiAt(shown)) return;
    hideHint();
    setSub(shown, plates[shown].sub + d);
  }

  /* 캡션 · 사진 번호 · 좌우 버튼을 지금 단계에 맞춘다 */
  function paintPh(k){
    var p = plates[k], many = multiAt(k);
    var c = p && (many ? p.photos[p.sub].cap : p.cap);
    capEl.textContent = capBase + (c ? ' · ' + c : '');
    var phn = document.getElementById('dtPhn');
    phn.hidden = !many;
    if (many) document.getElementById('dtPhNo').textContent = t('photoN', {i:p.sub + 1, n:p.photos.length});
    detailEl.querySelectorAll('[data-flip]').forEach(function(b){
      if (b.classList.contains('dt-pn')) b.hidden = !many;
      b.disabled = !many || (+b.dataset.flip < 0 ? p.sub === 0 : p.sub === p.photos.length - 1);
    });
  }

  function detailOf(it){
    if (DETAIL[it.id]) return DETAIL[it.id];
    return {
      lead: t('fbLead', {sub:it.sub}),
      sections: [{h:t('fbH'), p:[
        t('fbP1', {cat:CAT[it.cat], id:it.id, date:when(it)}),
        t('fbP2', {meta:it.meta, tags:it.tags})
      ]}]
    };
  }

  /* 또렷한 단계가 바뀔 때 : 캡션 · 쪽수 · 접근성 표시 */
  function markActive(k){
    shown = activeFig = k;
    steps.forEach(function(st, j){
      st.el.classList.toggle('on', j === k);
      if (j === k) st.el.setAttribute('aria-current', 'true');
      else st.el.removeAttribute('aria-current');
    });
    paintPh(k);
    countEl.textContent = nn(k + 1) + ' / ' + nn(steps.length);
  }

  /* ---- 단계 넘기기 ---- */
  function articleOn(){ return mode === 'article' && !detailEl.hidden && viewer.hidden && steps.length; }

  /* 단계마다 글 줄기(.dt-flow)를 놓을 세로 위치(정지점).
     · 글 전체가 열에 들어가면 움직이지 않는다 (가운데 정렬, 밝기만 바뀜)
     · 아니면 현재 절을 도판의 세로 중심에 맞춘다. 1열(도판 위 · 글 아래)은 위에 붙인다
     · 열보다 긴 절은 열 높이의 70% 씩 나눠 내려간다
     · 어느 경우든 줄기의 처음과 끝이 흐림 영역(PAD) 밖으로 벗어나지 않게 자른다 */
  var oneCol = window.matchMedia('(max-width:900px)');
  var PAD = 28;   // .dt-main 위아래 흐림 폭
  function stopsOf(el){
    var H = mainEl.clientHeight, F = flowEl.offsetHeight, top = el.offsetTop, h = el.offsetHeight;
    if (F <= H - 2 * PAD) return [Math.round((H - F) / 2)];
    var lo = H - PAD - F;
    function clamp(y){ return Math.round(Math.max(lo, Math.min(PAD, y))); }
    if (h <= H - 2 * PAD) return [clamp(oneCol.matches ? PAD - top : H / 2 - top - h / 2)];
    var out = [], last = H - PAD - top - h, gap = Math.max(80, Math.round(H * 0.7));
    /* 끝까지 남은 거리가 짧으면(간격의 30% 미만) 따로 멈추지 않고 끝으로 바로 간다 */
    for (var y = PAD - top; y > last + gap * 0.3; y -= gap) out.push(clamp(y));
    out.push(clamp(last));
    return out.filter(function(v, i){ return i === 0 || v !== out[i - 1]; });
  }

  function firstStop(k){
    for (var i = 0; i < path.length; i++) if (path[i].k === k) return i;
    return 0;
  }

  /* pos 한 값으로 화면 전체를 그린다. 모든 값이 pos 의 연속 함수라 끊김이 없다
     · 글 줄기 위치 : 인접한 두 정지점 사이를 보간
     · 절 밝기     : 현재 위치에서 멀어질수록 0.5 까지 흐려짐 (그 아래로는 글이 안 읽힌다)
     · 도판        : 다음 장을 위에 얹어 페이드인하고, 이전 장은 조금 늦게 따라 사라진다.
                     사진마다 비율이 달라 다음 장이 이전 장을 다 덮지 못하므로
                     이전 장도 끝까지 서서히 빠져야 마지막에 툭 꺼지지 않는다 */
  function smooth(t){ return t * t * (3 - 2 * t); }
  function render(){
    if (!path.length) return;
    var i = Math.min(Math.floor(pos), path.length - 1), f = pos - i;
    var a = path[i], b = path[Math.min(i + 1, path.length - 1)];
    var y = a.y + (b.y - a.y) * f, kp = a.k + (b.k - a.k) * f;
    flowEl.style.transform = 'translate3d(0,' + y.toFixed(2) + 'px,0)';
    steps.forEach(function(st, j){
      var o = (0.5 + 0.5 * Math.max(0, 1 - Math.abs(kp - j))).toFixed(3);
      if (st.o !== o){ st.el.style.opacity = o; st.o = o; }
    });
    var base = Math.floor(kp), t = kp - base, e = smooth(t);
    var out = 1 - smooth(Math.max(0, (t - 0.35) / 0.65));
    figEls.forEach(function(el, j){
      var op = j === base ? out : j === base + 1 ? e : 0;
      var key = op.toFixed(3);
      if (el._k === key) return;
      el._k = key;
      el.style.opacity = key;
      el.style.zIndex = j === base + 1 ? 2 : j === base ? 1 : 0;
      el.style.transform = j === base + 1 ? 'scale(' + (1 + 0.03 * (1 - e)).toFixed(4) + ')' : '';
    });
    var act = Math.round(kp);
    if (act !== shown) markActive(act);
  }

  /* 지수 감속 추종. 프레임 속도와 무관하게 같은 시간(TAU)에 같은 비율만큼 다가간다 */
  var TAU = 0.1, raf = 0, lastT = 0;
  var still = window.matchMedia('(prefers-reduced-motion: reduce)');
  function tick(t){
    var dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 1 / 60;
    lastT = t;
    pos += (target - pos) * (1 - Math.exp(-dt / TAU));
    if (Math.abs(target - pos) < 0.0005) pos = target;
    render();
    if (pos !== target) raf = requestAnimationFrame(tick);
    else { raf = 0; lastT = 0; }
  }
  function setTarget(v){
    target = Math.max(0, Math.min(path.length - 1, v));
    if (still.matches){ pos = target; render(); return; }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function moveTo(v){ hideHint(); setTarget(v); }
  function go(d){ moveTo(d > 0 ? Math.floor(target + 1e-3) + 1 : Math.ceil(target - 1e-3) - 1); }

  /* 다시 잴 때(열기 · 크기 변경 · 글꼴 로드) : 지금 보던 단계의 첫 정지점에 그대로 놓는다 */
  var keepAt = null;   // 다시 열 때(언어 바꾸기) 이 단계에 그대로 놓는다
  function measure(){
    if (!steps.length || detailEl.hidden) return;
    var keep = keepAt != null ? Math.min(keepAt, steps.length - 1) : shown < 0 ? 0 : shown;
    keepAt = null;
    /* 표지 · 타이포 도판(260 × 356.2 판)을 무대에 꽉 차게 키우는 배율 */
    var r = figsEl.getBoundingClientRect();
    figsEl.style.setProperty('--ps', Math.min(r.width / 260, r.height / 356.2).toFixed(4));
    steps.forEach(function(st){ st.stops = stopsOf(st.el); });
    path = [];
    steps.forEach(function(st, k){ st.stops.forEach(function(y){ path.push({k:k, y:y}); }); });
    if (raf){ cancelAnimationFrame(raf); raf = 0; lastT = 0; }
    pos = target = firstStop(keep);
    render();
  }

  function showHint(){
    clearTimeout(hintTimer);
    if (steps.length < 2) return;
    hintTimer = setTimeout(function(){
      hintEl.classList.add('on');
      hintTimer = setTimeout(hideHint, 2800);
    }, 600);
  }
  function hideHint(){
    clearTimeout(hintTimer);
    if (hintEl) hintEl.classList.remove('on');
  }

  /* 휠 · 트랙패드 · 터치 : 한 제스처에 한 정지점씩.
     · 움직인 양이 COMMIT(한 단위의 12% ≈ 36px)을 넘는 순간 곧바로 다음 정지점으로 출발하고
     · 그 제스처가 끝날 때까지(입력이 GAP ms 끊길 때까지) 남은 입력은 무시한다
       → 세게 쓸어도, 트랙패드 관성이 이어져도, 휠을 빠르게 굴려도 하나씩 걸린다
     · 문턱 전에는 글이 입력을 살짝 따라오고, 넘지 못하고 멈추면 제자리로 돌아간다 */
  var UNIT = 300, COMMIT = 0.12, GAP = 180;
  var snapTimer = 0, from = 0, lastIn = 0, locked = false;
  function nudge(d){
    var now = performance.now();
    if (now - lastIn > GAP){ from = Math.round(target); locked = false; }   // 새 제스처
    lastIn = now;
    clearTimeout(snapTimer);
    if (locked) return;
    var moved = target + d - from;
    if (Math.abs(moved) >= COMMIT){ locked = true; moveTo(from + (moved > 0 ? 1 : -1)); }
    else moveTo(from + moved);
  }
  function snap(){ if (!locked) setTarget(from); }

  /* 가로 밀기 : 한 제스처에 사진 한 장 (세로와 같은 방식으로 잠근다) */
  var hx = 0, hLast = 0, hLocked = false;
  function swipeX(dx){
    var now = performance.now();
    if (now - hLast > GAP){ hx = 0; hLocked = false; }
    hLast = now;
    if (hLocked) return;
    hx += dx;
    if (Math.abs(hx) >= 40){ hLocked = true; flip(hx > 0 ? 1 : -1); }
  }

  detailEl.addEventListener('wheel', function(e){
    if (!articleOn()) return;
    e.preventDefault();
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)){ swipeX(e.deltaX); return; }
    var dy =e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * mainEl.clientHeight : e.deltaY;
    nudge(dy / UNIT);
    snapTimer = setTimeout(snap, GAP);
  }, {passive:false});

  /* 흐린 절을 누르면 그 절로 (링크는 그대로 동작) */
  detailEl.addEventListener('click', function(e){
    if (!articleOn() || e.target.closest('a')) return;
    var fb = e.target.closest('[data-flip]');
    if (fb){ flip(+fb.dataset.flip); return; }
    var el = e.target.closest('.dt-step');
    for (var k = 0; el && k < steps.length; k++){
      if (steps[k].el === el && k !== shown){ moveTo(firstStop(k)); return; }
    }
  });

  /* 처음 8px 움직인 방향으로 축을 정한다. 가로면 (사진이 여러 장인 단계에서) 사진 넘기기 */
  var touchY = null, touchX0 = 0, touchY0 = 0, axis = '';
  detailEl.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    touchY = articleOn() ? t.clientY : null;
    touchX0 = t.clientX; touchY0 = t.clientY; axis = '';
    from = Math.round(target); locked = false;   // 손가락을 댈 때마다 새 제스처
  }, {passive:true});
  detailEl.addEventListener('touchmove', function(e){
    if (touchY === null) return;
    e.preventDefault();
    var t = e.touches[0];
    if (!axis){
      var ax = Math.abs(t.clientX - touchX0), ay = Math.abs(t.clientY - touchY0);
      if (ax < 8 && ay < 8) return;
      axis = ax > ay && multiAt(shown) ? 'x' : 'y';
    }
    if (axis === 'x') return;
    lastIn = performance.now();   // 손가락을 뗄 때까지는 잠시 멈춰도 같은 제스처
    var y = t.clientY;
    nudge((touchY - y) / Math.max(200, mainEl.clientHeight * 0.45));
    touchY = y;
  }, {passive:false});
  detailEl.addEventListener('touchend', function(e){
    if (touchY === null) return;
    touchY = null;
    if (axis === 'x'){
      var dx = e.changedTouches[0].clientX - touchX0;
      if (Math.abs(dx) > 40) flip(dx < 0 ? 1 : -1);
      return;
    }
    snap();
  });

  /* 크기가 바뀐 그 프레임에 다시 잰다 — 도판(CSS)과 글(JS)의 중심이 어긋나지 않게 */
  if ('ResizeObserver' in window) new ResizeObserver(function(){ measure(); }).observe(detailEl);
  else window.addEventListener('resize', measure);

  /* 껍데기를 다시 심고 끊어진 참조와 리스너를 되살린다 */
  function mountArticle(){
    detailEl.innerHTML = detailShell;
    figsEl = document.getElementById('dtFigs');
    capEl  = document.getElementById('dtCap');
    mainEl = document.getElementById('dtMain');
    metaEl = document.getElementById('dtMeta');
    countEl = document.getElementById('dtCount');
    hintEl  = document.getElementById('dtHint');
    document.getElementById('dtOpenFig').addEventListener('click', openViewer);
    document.documentElement.classList.remove('tk-on');
    mode = 'article';
    applyStatic();   // 껍데기는 처음 언어로 저장돼 있다
  }

  function openDetail(it){
    closeViewer();
    if (mode !== 'article') mountArticle();
    var d = detailOf(it);

    cur = it;
    activeFig = 0;
    plates = [{html:cover(it), label:t('cover')}];
    var figures = d.figures || [];
    d.sections.forEach(function(s, i){
      var ph = photosOf(s, figures), f = ph[0];
      if (ph.length > 1) plates.push({html:multiPlate(ph, s.h), label:s.h, photo:true, photos:ph, sub:0});
      else plates.push(f
        ? {html:photoPlate(f, f.cap || s.h), label:s.h, cap:f.cap, photo:true}
        : {html:figPlate(it, i + 1, s.h), label:s.h});
    });
    views = [];
    plates.forEach(function(p, k){
      if (!p.photos) { views.push({html:p.html, label:p.label, k:k, j:0}); return; }
      p.photos.forEach(function(f, j){
        views.push({html:photoPlate(f, f.cap || p.label), label:p.label + ' · ' + (j + 1) + ' / ' + p.photos.length, k:k, j:j});
      });
    });
    /* 사진은 무대에 원래 비율로, 표지 · 타이포 도판은 260px 판(.plate)째로 확대해 건다 */
    figsEl.innerHTML = plates.map(function(f){
      return '<span class="fig">' + (f.photo ? f.html : '<span class="plate">' + f.html + '</span>') + '</span>';
    }).join('');
    capBase = it.id + ' · ' + when(it);
    capEl.textContent = capBase;
    metaEl.textContent = [CAT[it.cat], it.sub, it.meta].filter(Boolean).join(' · ');
    var editEl = document.getElementById('dtEdit');
    editEl.hidden = !adminIn();
    editEl.href = ADMIN_URL + '?edit=' + encodeURIComponent(it.id);

    /* 글 전체를 한 줄기(.dt-flow)로. 단계마다 하나의 블록(.dt-step) */
    var lede = d.lede != null ? d.lede : d.lead;
    var html = '<div class="dt-flow">'
      + '<header class="dt-step dt-head">'
      + '<h2 id="dtTitle" tabindex="-1">' + esc(it.title) + '</h2>'
      + (lede ? '<p class="dt-lead">' + esc(lede) + '</p>' : '');
    /* meta 는 [라벨, 값] 쌍의 배열. 비어 있으면 표를 그리지 않는다 */
    if (d.meta && d.meta.length){
      html += '<table class="dt-mt"><tbody>' + d.meta.map(function(r){
        return '<tr><th scope="row">' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>';
      }).join('') + '</tbody></table>';
    }
    html += '</header>';
    /* links 는 {label, href} 의 배열. 링크와 돌아가기는 마지막 절에 붙인다 */
    var tail = '';
    if (d.links && d.links.length){
      tail += '<ul class="dt-links">' + d.links.map(function(l){
        return '<li><a href="' + esc(l.href) + '" target="_blank" rel="noopener">' + esc(l.label || l.href) + '</a></li>';
      }).join('') + '</ul>';
    }
    tail += '<p class="dt-end"><a href="#index">' + t('backToIndex') + '</a></p>';
    d.sections.forEach(function(s, i){
      html += '<section class="dt-step dt-sec">'
        + '<h3><span class="no">' + nn(i + 1) + '</span>' + esc(s.h) + '</h3>'
        + (s.p || []).map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('')
        + (i === d.sections.length - 1 ? tail : '')
        + '</section>';
    });
    mainEl.innerHTML = html + '</div>';
    flowEl = mainEl.firstChild;

    steps = [];
    mainEl.querySelectorAll('.dt-step').forEach(function(el){ steps.push({el:el, stops:[0]}); });
    figEls = [].slice.call(figsEl.children);
    shown = -1;
    /* 입장 애니메이션을 매번 처음부터 */
    [mainEl, figsEl].forEach(function(el){
      el.classList.remove('enter');
      void el.offsetWidth;
      el.classList.add('enter');
    });

    pageEl.hidden = true;
    detailEl.classList.add('paged');
    detailEl.hidden = false;
    document.title = it.title + ' — ' + t('site');
    window.scrollTo(0, 0);
    measure();
    showHint();
    document.getElementById('dtTitle').focus({preventScroll:true});
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  }
