<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 — 한지웅의 아카이브</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#000;--fg:#fff;--dim:#8a8a8a;--rule:#242424;--paper:#ebe9e3;--ink:#121212;--red:#e0301e}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);
  font-family:"Pretendard Variable","Pretendard","Helvetica Neue",Helvetica,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
  font-size:12px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;
  word-break:keep-all;overflow-wrap:break-word}   /* 한국어는 띄어쓰기 단위로 줄바꿈 */
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:inherit;background:none;border:0;padding:0;resize:none}
input:focus,textarea:focus,select:focus{outline:0}
:focus-visible{outline:1px solid var(--red);outline-offset:3px}
select option{background:#111;color:#fff}
[hidden]{display:none!important}

/* ---------- 상단 바 ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:0 16px;padding:12px 28px}
.bar .mark{font-weight:700}
.bar .state{color:#5a5a5a;margin-left:auto}
.bar .state.on{color:var(--red)}
.bar .btn{padding:7px 16px;background:var(--fg);color:var(--bg)}
.bar .btn:hover{background:var(--red);color:#fff}
.bar .btn:disabled{background:#2a2a2a;color:#8a8a8a;cursor:default}

/* ---------- 들어오기 (비밀번호) ---------- */
.gate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:28px}
.gate-box{width:min(360px,100%)}
.gate-t{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-0.03em;line-height:1.1;margin:0 0 22px}
.gate-row{display:flex;gap:12px;align-items:center}
.gate-row input{flex:1;min-width:0;font-size:14px;padding:6px 0;border-bottom:1px solid #3a3a3a}
.gate-row input:focus{border-bottom-color:var(--red)}
.gate-row input::placeholder{color:#4f4f4f}
.gate .btn{padding:7px 16px;background:var(--fg);color:var(--bg)}
.gate .btn:hover{background:var(--red);color:#fff}
.gate .btn:disabled{background:#2a2a2a;color:#8a8a8a}
.gate-msg{min-height:1.5em;margin:10px 0 0;color:var(--red);line-height:1.6}
.gate-msg a{color:var(--fg)}
.gate-back{display:inline-block;margin-top:26px;color:var(--dim)}

/* ---------- 올린 글 목록 ---------- */
.posts{margin-bottom:34px;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.posts .lab{display:flex;gap:10px;color:var(--dim);margin:0 0 8px}
.posts .lab .n{color:#4f4f4f}
.pr{display:grid;grid-template-columns:86px 40px minmax(0,1fr) auto auto auto;gap:0 14px;align-items:baseline;padding:9px 0;border-top:1px solid var(--rule)}
.pr.on b{color:var(--red)}
.pr .d,.pr .i{color:var(--dim);font-variant-numeric:tabular-nums}
.pr .c{color:var(--dim)}
.pr b{font-weight:400;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr button{color:var(--dim);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px}
.pr button:hover,.pr button.armed{color:var(--red)}
.posts .msg{color:var(--dim);padding:9px 0;border-top:1px solid var(--rule);margin:0}
@media (max-width:640px){
  .pr{grid-template-columns:minmax(0,1fr) auto auto}
  .pr .d,.pr .c,.pr .i{display:none}
}
/* 올리기 전에 비어 있는 칸 */
.miss{box-shadow:inset 0 -1px 0 var(--red)}
.miss::placeholder{color:var(--red) !important}
.bar .ghost{color:var(--dim);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px}
.bar .ghost:hover{color:var(--red)}
.bar .ghost.armed{color:var(--red);text-decoration-color:var(--red)}

.page{max-width:1500px;margin:0 auto;padding:30px 28px 14vh}

/* ---------- 머리말 ---------- */
.head .title{width:100%;font-size:clamp(26px,3.4vw,44px);line-height:1.1;letter-spacing:-0.03em;font-weight:700}
.head .title::placeholder{color:#333}
.head .sub{width:100%;font-size:14px;color:var(--dim);margin-top:8px}
.head .sub::placeholder{color:#333}
.head .lede{width:100%;font-size:13.5px;line-height:1.7;margin-top:14px;min-height:1.7em}
.head .lede::placeholder{color:#333}

.meta{display:flex;flex-wrap:wrap;gap:0 22px;align-items:baseline;margin-top:20px;
  padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.meta .cell{display:flex;align-items:baseline;gap:0 9px}
.meta label{color:var(--dim)}
.meta input,.meta select{font-size:13px;min-width:0}
.meta .id{width:110px}
.meta .tags{width:190px}
.meta .mk{width:90px}
/* 날짜 : 어두운 달력 · 아이콘이 검은 배경에서 보이게 */
.meta input[type="date"]{color-scheme:dark;cursor:pointer}
.meta input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.75}
.meta input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1}

/* ---------- 표지 ---------- */
.covers{margin-top:22px}
.covers .lab{color:var(--dim);margin-bottom:9px}
.strip{display:flex;flex-wrap:wrap;gap:10px}
.pick{position:relative;width:85px;height:117px;overflow:hidden;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule)}
.pick[aria-pressed="true"]{box-shadow:0 0 0 1px var(--red)}
.pick .frame{position:absolute;top:0;left:0;width:170px;height:233px;background:var(--paper);color:var(--ink);transform:scale(.5);transform-origin:top left}
.pick .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);color:#fff;font-size:9px;text-align:center;padding:2px 0;z-index:2}
/* 사진 표지일 때 : 넣은 사진 중에서 대표 사진 고르기 */
.reps{margin-top:12px}
.reps .lab{margin-bottom:7px}
.reps .row{display:flex;flex-wrap:wrap;gap:6px}
.rep{width:56px;height:40px;padding:0;background:#0c0c0c;box-shadow:inset 0 0 0 1px var(--rule)}
.rep img{display:block;width:100%;height:100%;object-fit:cover;opacity:.5}
.rep:hover img{opacity:1}
.rep[aria-pressed="true"]{box-shadow:0 0 0 1px var(--red)}
.rep[aria-pressed="true"] img{opacity:1}

/* ---------- 작업 영역: 왼쪽 사진 목록 / 오른쪽 글 ---------- */
.work{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0 40px;margin-top:34px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:minmax(0,1fr);gap:26px}.tray{position:static}}
.tray{position:sticky;top:62px}
.tray .lab{display:flex;align-items:baseline;gap:10px;color:var(--dim);margin-bottom:9px}
.tray .lab .n{margin-left:auto;color:#4f4f4f;font-variant-numeric:tabular-nums}
.drop{display:block;border:1px dashed #3a3a3a;padding:18px 12px;text-align:center;color:var(--dim);cursor:pointer}
.drop.over{border-color:var(--red);color:var(--fg)}
.drop input{display:none}
.tray .opt{display:flex;align-items:center;gap:7px;margin-top:8px;color:var(--dim);cursor:pointer}
.tray .opt input{accent-color:var(--red)}
.list{margin-top:8px}
.th{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:0 10px;align-items:center;
  padding:8px 0 8px 8px;border-top:1px solid var(--rule);cursor:pointer}
.th::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:transparent}
.th.on::before{background:var(--red)}
.th .pic{position:relative;width:64px;height:44px}
.th img{width:64px;height:44px;object-fit:cover;display:block;background:#0c0c0c}
.th .pic i{position:absolute;right:0;bottom:0;background:#000;color:#fff;font-style:normal;font-size:9px;line-height:14px;padding:0 4px;font-variant-numeric:tabular-nums}
.th .tt{min-width:0}
.th .tt b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .tt span{color:#4f4f4f;font-size:10px}
.th .tt span.ok{color:var(--dim)}
.th.on .tt b{color:var(--fg)}
.th:not(.on) .tt b{color:var(--dim)}
.th .ops{display:flex;gap:2px;opacity:0}
.th:hover .ops,.th.on .ops{opacity:1}
.th .ops button{width:20px;height:18px;color:#4f4f4f;font-size:11px;line-height:1}
.th .ops button:hover{color:var(--red)}

.edit{min-height:50vh}
.edit .empty{color:#4f4f4f;padding:40px 0;max-width:40ch;line-height:1.8}
.edit .big{background:#0c0c0c;box-shadow:inset 0 0 0 1px var(--rule)}
.edit .big.over{box-shadow:inset 0 0 0 1px var(--red)}
.edit .big img{display:block;width:100%;max-height:56vh;object-fit:contain}
/* 한 페이지 안의 사진들 : 누르면 위에 크게, 순서 바꾸기 · 떼어 내기 · 빼기 */
.phs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ph{position:relative;width:76px}
.ph .im{display:block;width:76px;height:52px;padding:0;background:#0c0c0c;box-shadow:inset 0 0 0 1px var(--rule)}
.ph .im img{display:block;width:100%;height:100%;object-fit:cover;opacity:.55}
.ph.on .im{box-shadow:0 0 0 1px var(--red)}
.ph.on .im img,.ph .im:hover img{opacity:1}
.ph .po{display:flex;justify-content:space-between;margin-top:3px;opacity:0}
.ph:hover .po,.ph.on .po{opacity:1}
.ph .po button{color:#4f4f4f;font-size:10px;padding:0 2px}
.ph .po button:hover{color:var(--red)}
.ph .po button:disabled{color:#262626;cursor:default}
.phs .add{display:flex;align-items:center;justify-content:center;width:76px;height:52px;border:1px dashed #3a3a3a;color:var(--dim);font-size:11px;cursor:pointer}
.phs .add:hover{border-color:var(--red);color:var(--fg)}
.phs .add input{display:none}

/* 끌어서 옮기기 : 놓일 자리에 빨간 선, 다른 페이지로 옮길 때는 그 페이지를 칠한다 */
.ph[draggable="true"]{cursor:grab}
.dragging{opacity:.35}
.th.mk-before{box-shadow:inset 0 2px 0 var(--red)}
.th.mk-after{box-shadow:inset 0 -2px 0 var(--red)}
.th.mk-into{background:#1c0806}
.th.mk-into .tt b{color:var(--fg)}
.ph.mk-before::before,.ph.mk-after::before{content:"";position:absolute;top:0;width:2px;height:52px;background:var(--red)}
.ph.mk-before::before{left:-5px}
.ph.mk-after::before{right:-5px}
.edit .fn{color:#4a4a4a;font-size:10px;margin-top:7px}
.edit .t{width:100%;font-size:19px;font-weight:700;line-height:1.3;margin-top:18px}
.edit .t::placeholder{color:#333}
.edit .d{width:100%;font-size:14.5px;line-height:1.85;margin-top:8px;min-height:7em}
.edit .d::placeholder{color:#333}
.edit .nav{display:flex;align-items:baseline;gap:0 18px;margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.edit .nav button{color:var(--dim);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px}
.edit .nav button:hover{color:var(--red)}
.edit .nav button:disabled{color:#333;text-decoration:none;cursor:default}
.edit .nav .pos{margin-left:auto;color:#4f4f4f;font-variant-numeric:tabular-nums}

/* ---------- 표지 템플릿 ---------- */
.cv{position:absolute;top:0;right:0;bottom:0;left:0;padding:9px;display:flex;flex-direction:column;overflow:hidden}
.cv.dark{background:#0a0a0a;color:#f2f2f2}
.t-gridnum .row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.t-gridnum .kick{font-size:9px;line-height:1.25;max-width:56%}
.t-gridnum .no{font-size:26px;line-height:.82;letter-spacing:-0.04em;flex:0 0 auto}
.t-gridnum .mid{margin:auto 0;display:flex;gap:10px}
.t-gridnum .mid span{font-size:10px;line-height:1.25;display:block;min-width:0}
.t-gridnum .mid .a{flex:1 1 60%}
.t-gridnum .mid .b{flex:1 1 40%;color:#6d6d6d}
.t-gridnum .foot{font-size:9px;color:#6d6d6d}
.t-stack{justify-content:center;align-items:center;text-align:center}
.t-stack .rule{position:absolute;left:9px;right:9px;top:26px;height:1px;background:#c9c6bf}
.t-stack .l1{font-size:11px;line-height:1.25}
.t-stack .l2{font-size:8.5px;line-height:1.35;color:#5f5f5f;margin-top:2px}
.t-stack .l3{font-size:7.5px;line-height:1.35;color:#9c988f;margin-top:1px}
.t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-mono .head{font-size:9px;color:#7c7c7c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-mono .lines{margin:auto 0;font-size:9px;line-height:1.55}
.t-mono .lines span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-mono .lines .hi{color:#fff}
.t-mono .lines .lo{color:#6f6f6f}
.t-mono .caret{width:6px;height:10px;background:var(--red);display:block;flex:0 0 auto}
.t-alpha .abc{font-size:10px;line-height:1.35;color:#8d8a83;letter-spacing:.08em}
.t-alpha .word{margin-top:auto;font-size:12px;line-height:1.2;color:var(--ink)}
.t-alpha .sub{font-size:8.5px;color:#6d6d6d;margin-top:3px}
.t-plate{justify-content:center;text-align:center;padding:9px 11px}
.t-plate .top{position:absolute;left:11px;right:11px;top:11px;border-top:1px solid #1a1a1a}
.t-plate .bot{position:absolute;left:11px;right:11px;bottom:11px;border-top:1px solid #1a1a1a}
.t-plate .ttl{font-size:13px;line-height:1.25;letter-spacing:-0.02em}
.t-plate .au{font-size:9px;color:#5f5f5f;margin-top:7px}
.t-plate .yr{font-size:8.5px;color:#8e8a82;margin-top:2px}
.t-spine{flex-direction:row;align-items:stretch;justify-content:space-between;gap:6px}
.t-spine .meta{font-size:8.5px;color:#8d8d8d;line-height:1.45;flex:0 0 auto;display:block;margin:0;padding:0;border:0}
.t-spine .vert{writing-mode:vertical-rl;font-size:11px;line-height:1.15;align-self:flex-start;max-height:100%;overflow:hidden;flex:0 0 auto}
.t-spine .vert.accent{color:var(--red)}
.t-redbar .bar{position:static;background:var(--red);color:#fff;padding:8px;margin:-9px -9px 0;min-height:47%;display:flex;align-items:flex-end;border:0}
.t-redbar .bar span{font-size:12px;line-height:1.2}
.t-redbar .body{margin-top:auto;font-size:9px;line-height:1.45;color:#5f5f5f}
.t-pic{padding:0;background:#0c0c0c}
.t-pic img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.t-pic .tag{position:absolute;left:9px;top:9px;background:#000;color:#fff;font-size:9px;line-height:1;padding:3px 5px}
.t-pic .none{margin:auto;color:#6d6d6d;font-size:10px;line-height:1.5;text-align:center}
</style>
</head>
<body>

<div class="bar">
  <span class="mark" id="mark">글쓰기</span>
  <button class="ghost" id="postsBtn" type="button">글 목록</button>
  <button class="ghost" id="fresh" type="button">새 글</button>
  <button class="ghost" id="preview" type="button">미리보기</button>
  <span class="state" id="state">—</span>
  <button class="btn" id="save" type="button">올리기</button>
  <button class="ghost" id="logout" type="button">나가기</button>
</div>

<!-- 들어올 때 비밀번호 확인 -->
<div class="gate" id="gate" hidden>
  <form class="gate-box" id="gateForm">
    <p class="gate-t">관리자</p>
    <div class="gate-row">
      <input id="gatePw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호">
      <button class="btn" type="submit">들어가기</button>
    </div>
    <p class="gate-msg" id="gateMsg"></p>
    <a class="gate-back" href="./">← 아카이브로</a>
  </form>
</div>

<div class="page">
  <!-- 올린 글 목록 : 수정 · 삭제 -->
  <section class="posts" id="posts" hidden>
    <p class="lab">올린 글 <span class="n" id="postsN"></span></p>
    <div id="postsList"></div>
  </section>

  <div class="head">
    <input class="title" id="fTitle" placeholder="제목">
    <input class="sub" id="fSub" placeholder="한 줄 설명">
    <textarea class="lede" id="fLede" placeholder="들어가는 말 (선택)"></textarea>
  </div>

  <div class="meta">
    <span class="cell"><label for="fCat">분류</label>
      <select id="fCat"><option value="research">연구</option><option value="activity">활동</option><option value="dev">개발</option><option value="read">독서</option></select></span>
    <span class="cell"><label for="fDate">날짜</label><input id="fDate" type="date"></span>
    <span class="cell"><label for="fId">주소</label><input class="id" id="fId" placeholder="r-015"></span>
    <span class="cell"><label for="fMeta">표기</label><input class="mk" id="fMeta" placeholder="Note 15"></span>
    <span class="cell"><label for="fTags">태그</label><input class="tags" id="fTags" placeholder="공백으로 구분"></span>
  </div>

  <div class="covers">
    <p class="lab">표지</p>
    <div class="strip" id="strip"></div>
    <div class="reps" id="reps" hidden></div>
  </div>

  <div class="work">
    <aside class="tray">
      <p class="lab">페이지 <span class="n" id="count">0페이지</span></p>
      <label class="drop" id="drop">사진이나 PDF 를 끌어다 놓거나 눌러서 고르세요<br>PDF 는 쪽마다 사진 한 장이 되어 한 페이지에 묶입니다
        <input type="file" id="file" accept="image/*,.heic,.heif,application/pdf,.pdf" multiple></label>
      <label class="opt"><input type="checkbox" id="group"> 한 번에 넣은 사진을 한 페이지로 묶기</label>
      <div class="list" id="list"></div>
    </aside>

    <section class="edit" id="edit"></section>
  </div>
</div>

<script>
var CAT = {research:'연구', activity:'활동', dev:'개발', read:'독서'};
var COVERS = ['photo','gridnum','stack','mono','alpha','plate','spine','redbar'];
var COVER_NAME = {photo:'사진', gridnum:'번호', stack:'반복', mono:'터미널', alpha:'알파벳', plate:'책', spine:'책등', redbar:'빨강'};

/* pages : {title, text, photos:[{url, thumb, ext, name, sha}]}
   url 은 올릴 원본(data URL), thumb 는 목록용 작은 사진, sha 는 서버에 미리 올려 둔 사진의 식별값
   coverPhoto : 사진 표지로 쓸 사진(객체 그대로 — 순서가 바뀌어도 따라간다) */
var P = { cover:'gridnum', pages:[], coverPhoto:null, editing:null };   // editing : 고치는 중인 글의 원래 주소
var sel = -1, ph = 0;                    // sel: 고른 페이지, ph: 그 페이지에서 크게 보는 사진

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
function v(id){ return $(id).value.trim(); }
function today(){ return new Date().toISOString().slice(0,10); }
$('fDate').value = today();

/* ---------------- 표지 ---------------- */
function allPhotos(){ return [].concat.apply([], P.pages.map(function(p){ return p.photos; })); }
function locate(f){
  for (var i = 0; i < P.pages.length; i++){ var j = P.pages[i].photos.indexOf(f); if (j >= 0) return { i:i, j:j }; }
  return null;
}
/* 고른 사진이 빠졌으면 첫 사진으로 */
function coverPhoto(){ return locate(P.coverPhoto) ? P.coverPhoto : allPhotos()[0] || null; }

function coverHTML(kind){
  var t = esc(v('fTitle') || '제목'), s = esc(v('fSub') || '설명'), m = esc(v('fMeta') || 'Note');
  var cat = $('fCat').value, k = CAT[cat];

    case 'stack': return '<div class="cv t-stack"><div class="rule"></div><div class="l1">' + t + '</div><div class="l2">' + s + '</div><div class="l3">' + k + ' ' + m + '</div><div class="l3">' + k + ' ' + m + '</div></div>';
    case 'mono': return '<div class="cv t-mono dark"><div class="head">~/' + m + '</div><div class="lines"><span class="hi">' + t + '</span><span class="lo">' + s + '</span><span class="lo">' + esc(v('fTags')) + '</span><span class="lo">— ' + mm + '/' + yy + '</span></div><span class="caret"></span></div>';
    case 'alpha': return '<div class="cv t-alpha"><div class="abc">a bcd<br>e fgh<br>i jkl<br>m no<br>p qrs<br>t uv<br>w xyz</div><div class="word">' + t + '</div><div class="sub">' + k + ' ' + m + ' / ' + mm + '.' + yy + '</div></div>';
    case 'plate': return '<div class="cv t-plate"><div class="top"></div><div class="ttl">' + t + '</div><div class="au">' + s + '</div><div class="yr">' + m + '</div><div class="bot"></div></div>';
    case 'spine': return '<div class="cv t-spine dark"><div class="meta">' + k + '<br>' + mm + '.' + yy + '<br>' + m + '</div><div class="vert' + (cat === 'read' ? ' accent' : '') + '">' + t + '</div></div>';
    case 'redbar': return '<div class="cv t-redbar"><div class="bar"><span>' + t + '</span></div><div class="body">' + k + ' / ' + m + '<br>' + s + '<br>' + mm + '.' + yy + '</div></div>';
  }

}
function drawStrip(){

/* ---------------- 페이지 목록 ----------------
   사진 파일 번호는 페이지를 가로질러 이어진다 (r-015-1, r-015-2, ...) */
function photoNo(i, j){ var n = j; for (var k = 0; k < i; k++) n += P.pages[k].photos.length; return n + 1; }
function fileName(i, j){ return (v('fId') || 'item') + '-' + photoNo(i, j) + '.' + (P.pages[i].photos[j].ext || 'jpg'); }

function drawList(){

         +   '<span class="' + (done ? 'ok' : '') + '">' + (many ? '사진 ' + p.photos.length + '장 · ' : '') + (done ? '글 있음' : '아직 비어 있음') + '</span></span>'

         + '</div>';

          + '<button class="im" type="button" data-ph="' + j + '" aria-label="사진 ' + (j + 1) + ' 크게 보기"><img src="' + x.thumb + '" alt="" draggable="false"></button>'
          + '<span class="po">'
          +   '<button type="button" data-pl="' + j + '" title="앞으로" aria-label="앞으로"' + (j === 0 ? ' disabled' : '') + '>←</button>'

    + '</div>'
    + '<p class="fn">' + esc(fnText()) + '</p>'
    + '<input class="t" id="eT" value="' + esc(p.title) + '" placeholder="이 페이지의 제목">'
    + '<textarea class="d" id="eD" placeholder="이 페이지에 대한 글">' + esc(p.text) + '</textarea>'
    + '<div class="nav">'
    +   '<button id="prev" type="button"' + (sel === 0 ? ' disabled' : '') + '>이전 페이지</button>'
    +   '<button id="next" type="button"' + (sel === P.pages.length - 1 ? ' disabled' : '') + '>다음 페이지</button>'

function grow(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

function select(i){

  ph = 0;
  drawList();
  drawEdit(true);
}

/* 긴 변을 2000px 로 줄이고 JPEG 로 바꾼다. 작은 PNG(스크린샷 등)는 글자가 번지지 않게 그대로 둔다.
   목록 · 표지에 쓸 작은 사진(thumb)도 같이 만든다 — 큰 data URL 을 목록마다 다시 그리면 느려진다 */
function draw(img, max, type, q){
  var k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL(type, q);
}
function shrink(file){
  return new Promise(function(done){
    var keepPng = file.type === 'image/png' && file.size < 1.2e6;
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var thumb = draw(img, 320, 'image/jpeg', 0.8);
        if (keepPng) done({ url:r.result, thumb:thumb, ext:'png' });
        else done({ url:draw(img, 2000, 'image/jpeg', 0.86), thumb:thumb, ext:'jpg' });
      };
      img.onerror = function(){ done(null); };   // 브라우저가 못 여는 형식 — addFiles 가 빼고 알려 준다
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* 사진은 한 장씩 따로 보낸다. 요청 하나가 서버 한도(4.5MB)를 넘지 않으면 되므로
   장수 제한은 없고, 한 장이 data URL 로 약 4.2MB(원본 약 3MB) 를 넘을 때만 막는다 */
var PHOTO_MAX = 4.2e6;
function tooBig(){ return allPhotos().filter(function(f){ return f.url.length > PHOTO_MAX; }); }

/* ---------------- PDF · HEIC 변환 ----------------
   PDF 는 쪽마다 사진 한 장(긴 변 2000px JPEG)으로, 아이폰 HEIC 는 JPEG 로 바꾼 뒤 사진과 똑같이 다룬다.
   변환 도구는 처음 필요할 때만 불러온다 */
var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
var HEICTO = 'https://cdn.jsdelivr.net/npm/heic-to@1.6.5/dist/iife/heic-to.js';   // 최신 아이폰 HEIC 도 읽는다 (heic2any 는 못 읽음)
var libs = {};
function lib(src){
  return libs[src] || (libs[src] = new Promise(function(ok, no){
    var s = document.createElement('script');
    s.src = src;
    s.onload = ok;
    s.onerror = function(){ delete libs[src]; no(new Error('변환 도구를 불러오지 못했습니다 (인터넷 연결 확인)')); };
    document.head.appendChild(s);
  }));
}

function kindOf(f){
  var ext = (f.name.split('.').pop() || '').toLowerCase();
  if (f.type === 'application/pdf' || ext === 'pdf') return 'pdf';
  if (/^image\/hei[cf]/.test(f.type) || ext === 'heic' || ext === 'heif') return 'heic';
  if (/^image\//.test(f.type)) return 'image';
  return '';
}

async function fromHeic(f){
  await lib(HEICTO);
  var out = await HeicTo({ blob:f, type:'image/jpeg', quality:0.9 });
  return shrink(new File([out], f.name.replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' }));
}

async function fromPdf(f, onPage){
  await lib(PDFJS + 'pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  var doc = await pdfjsLib.getDocument({ data:await f.arrayBuffer() }).promise;
  var base = f.name.replace(/\.pdf$/i, ''), out = [];
  try {
    for (var n = 1; n <= doc.numPages; n++){
      onPage(n, doc.numPages);
      var page = await doc.getPage(n), v1 = page.getViewport({ scale:1 });
      var v = page.getViewport({ scale:Math.min(4, 2000 / Math.max(v1.width, v1.height)) });
      var c = document.createElement('canvas');
      c.width = Math.round(v.width); c.height = Math.round(v.height);
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);   // 투명한 쪽이 검게 나오지 않게
      await page.render({ canvasContext:ctx, viewport:v }).promise;
      out.push({ url:c.toDataURL('image/jpeg', 0.9), thumb:draw(c, 320, 'image/jpeg', 0.8), ext:'jpg', name:base + ' p' + n + '.jpg' });
      page.cleanup();
    }
  } finally {
    doc.destroy();
  }
  return out;
}

/* into 가 페이지 번호면 그 페이지에 사진을 더 넣는다.
   아니면 새 페이지로 — '한 페이지로 묶기'가 켜져 있으면 한 번에 넣은 것 전부를 한 페이지에,
   아니면 사진은 한 장씩, PDF 는 파일 하나가 한 페이지(쪽들을 좌우로 넘겨 봄) */
async function addFiles(list, into){
  var all = [].slice.call(list), files = all.filter(kindOf);
  var skipped = all.filter(function(f){ return !kindOf(f); }).map(function(f){ return f.name; });
  if (!files.length){ if (skipped.length) note('사진과 PDF 만 넣을 수 있습니다: ' + skipped.join(', '), true); return; }
  var group = $('group').checked, sets = [];
  note('사진을 정리하는 중...');
  for (var i = 0; i < files.length; i++){
    var f = files[i], k = kindOf(f);
    try {
      if (k === 'pdf'){
        var pages = await fromPdf(f, function(n, total){ note('PDF 를 사진으로 바꾸는 중... ' + f.name + ' ' + n + ' / ' + total + '쪽'); });
        if (pages.length) sets.push({ photos:pages });
      } else {
        var r = await (k === 'heic' ? fromHeic(f) : shrink(f));
        if (r) sets.push({ photos:[Object.assign(r, { name:k === 'heic' ? f.name.replace(/\.[^.]+$/, '') + '.jpg' : f.name })] });
        else skipped.push(f.name);
      }
    } catch (e) {
      skipped.push(f.name + (e && e.message ? ' (' + e.message + ')' : ''));
    }
  }
  sets.forEach(function(s){ s.photos = s.photos.map(function(r){ return { id:newId(), url:r.url, thumb:r.thumb, ext:r.ext, name:r.name }; }); s.photos.forEach(keepPhoto); });
  var photos = [].concat.apply([], sets.map(function(s){ return s.photos; }));
  if (photos.length){
    var pg = into >= 0 ? P.pages[into] : null;
    if (pg){
      if (into === sel) ph = pg.photos.length;
      pg.photos = pg.photos.concat(photos);
    } else {
      var first = P.pages.length;
      if (group) P.pages.push({ title:'', text:'', photos:photos });
      else sets.forEach(function(s){ P.pages.push({ title:'', text:'', photos:s.photos }); });   // 사진 한 장 또는 PDF 한 개가 한 페이지
      if (sel < 0){ sel = first; ph = 0; }
    }
  }
  var back = revive();
  redraw();
  var big = tooBig();
  if (skipped.length) note('넣지 못한 파일: ' + skipped.join(', '), true);
  else if (big.length) note(big.map(function(f){ return f.name; }).join(', ') + ' 은(는) 너무 커서 올릴 수 없습니다. 빼거나 작게 줄여 다시 넣어주세요.', true);
  else if (back) note('지난번에 쓴 페이지 글 ' + back + '개를 되살렸습니다.', true);
  else note('');
}
function redraw(){ drawStrip(); drawList(); drawEdit(); drawMode(); draft(); }

/* ---------------- 이벤트 ---------------- */
document.addEventListener('input', function(e){
  var t = e.target;
  t.classList.remove('miss');
  if (t.id === 'eT'){ P.pages[sel].title = t.value; drawList(); }
  else if (t.id === 'eD'){ P.pages[sel].text = t.value; grow(t); drawList(); }
  else if (t.id === 'fLede'){ grow(t); }
  else if (['fTitle','fSub','fMeta','fTags','fId','fDate'].indexOf(t.id) !== -1){ drawStrip(); if (t.id === 'fId') drawFn(); }
  draft();
});
$('fCat').addEventListener('change', function(){ drawStrip(); draft(); });
/* 날짜 칸 아무 데나 눌러도 달력이 열리게 */
$('fDate').addEventListener('click', function(){ try { this.showPicker(); } catch (e) {} });

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-c],[data-rep],[data-up],[data-dn],[data-mg],[data-rm],[data-sel],[data-ph],[data-pl],[data-pr],[data-sp],[data-px],#prev,#next');
  if (!t) return;
  var d = t.dataset, pg = P.pages[sel], i;
  if (d.c){ P.cover = d.c; drawStrip(); draft(); return; }
  if (d.rep !== undefined){ P.coverPhoto = allPhotos()[+d.rep]; drawStrip(); draft(); return; }
  if (t.id === 'prev'){ select(sel - 1); return; }
  if (t.id === 'next'){ select(sel + 1); return; }
  /* 페이지 안의 사진 */
  if (d.ph !== undefined){ ph = +d.ph; drawEdit(); return; }
  if (d.pl !== undefined){ i = +d.pl; move(pg.photos, i, i - 1); ph = i - 1; }
  else if (d.pr !== undefined){ i = +d.pr; move(pg.photos, i, i + 1); ph = i + 1; }
  else if (d.sp !== undefined){
    i = +d.sp;
    P.pages.splice(sel + 1, 0, { title:'', text:'', photos:pg.photos.splice(i, 1) });
    if (ph > i) ph--;
  }
  else if (d.px !== undefined){
    i = +d.px; pg.photos.splice(i, 1);
    if (!pg.photos.length) removePage(sel);
    else if (ph > i) ph--;
  }
  /* 페이지 */
  else if (d.up !== undefined){ i = +d.up; if (i > 0){ swap(i, i-1); sel = (sel === i ? i-1 : sel === i-1 ? i : sel); } e.stopPropagation(); }
  else if (d.dn !== undefined){ i = +d.dn; if (i < P.pages.length-1){ swap(i, i+1); sel = (sel === i ? i+1 : sel === i+1 ? i : sel); } e.stopPropagation(); }
  else if (d.mg !== undefined){ mergeUp(+d.mg); e.stopPropagation(); }
  else if (d.rm !== undefined){ removePage(+d.rm); e.stopPropagation(); }
  else if (d.sel !== undefined){ select(+d.sel); return; }
  redraw();
});
function swap(a, b){ var x = P.pages[a]; P.pages[a] = P.pages[b]; P.pages[b] = x; }
function move(arr, a, b){ arr.splice(b, 0, arr.splice(a, 1)[0]); }
function removePage(i){
  P.pages.splice(i, 1);
  if (sel === i){ sel = Math.min(i, P.pages.length - 1); ph = 0; }
  else if (sel > i) sel--;
}
/* i 번째 페이지의 사진과 글을 바로 위 페이지 뒤에 붙인다 */
function mergeUp(i){
  var a = P.pages[i - 1], b = P.pages[i], n = a.photos.length;
  a.photos = a.photos.concat(b.photos);
  a.title = a.title || b.title;
  a.text = [a.text, b.text].filter(Boolean).join('\n\n');
  P.pages.splice(i, 1);
  if (sel === i){ sel = i - 1; ph += n; }
  else if (sel > i) sel--;
}

$('file').addEventListener('change', function(e){ addFiles(e.target.files, -1); e.target.value = ''; });
document.addEventListener('change', function(e){
  if (e.target.id === 'addFile'){ addFiles(e.target.files, sel); e.target.value = ''; }
});
/* 파일 끌어다 놓기 (화면 안에서 끌어 옮기는 중이면 아래 '끌어서 옮기기'가 맡는다) */
var drop = $('drop');
['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev, function(e){ if (drag) return; e.preventDefault(); drop.classList.add('over'); }); });
['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ if (drag) return; e.preventDefault(); drop.classList.remove('over'); }); });
drop.addEventListener('drop', function(e){ if (!drag) addFiles(e.dataTransfer.files, -1); });
/* 오른쪽에 끌어다 놓으면 지금 페이지에 사진을 더 넣는다 */
var edit = $('edit');
function bigOver(on){ var b = $('big'); if (b) b.classList.toggle('over', on); }
['dragenter','dragover'].forEach(function(ev){ edit.addEventListener(ev, function(e){ if (drag) return; e.preventDefault(); bigOver(true); }); });
['dragleave','drop'].forEach(function(ev){ edit.addEventListener(ev, function(e){ if (drag) return; e.preventDefault(); bigOver(false); }); });
edit.addEventListener('drop', function(e){ if (!drag) addFiles(e.dataTransfer.files, sel); });

/* ---------------- 끌어서 옮기기 ----------------
   왼쪽 페이지 : 위아래로 끌어 순서 바꾸기
   페이지 안 사진 : 좌우로 끌어 순서 바꾸기, 왼쪽의 다른 페이지 위에 놓으면 그 페이지 끝으로 옮기기 */
var drag = null;   // {kind:'page'|'photo', from, el, to(끼워 넣을 자리), into(옮겨 갈 페이지)}
function unmark(){
  document.querySelectorAll('.mk-before,.mk-after,.mk-into').forEach(function(el){ el.classList.remove('mk-before', 'mk-after', 'mk-into'); });
}
function endDrag(){ if (drag) drag.el.classList.remove('dragging'); drag = null; unmark(); }
function reorder(arr, from, to){ if (to > from) to--; if (to !== from) arr.splice(to, 0, arr.splice(from, 1)[0]); }

document.addEventListener('dragstart', function(e){
  var el = e.target.closest && e.target.closest('.th[draggable],.ph[draggable]');
  if (!el) return;
  drag = el.classList.contains('th') ? { kind:'page', from:+el.dataset.sel } : { kind:'photo', from:+el.dataset.pi };
  drag.el = el;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
  setTimeout(function(){ if (drag) el.classList.add('dragging'); }, 0);
});
document.addEventListener('dragover', function(e){
  if (!drag) return;
  var over = e.target.closest('.th, .ph'), after = false;
  unmark(); drag.to = drag.into = null;
  if (!over) return;
  var r = over.getBoundingClientRect(), isPage = over.classList.contains('th');
  if (isPage && drag.kind === 'page'){
    after = e.clientY > r.top + r.height / 2;
    drag.to = +over.dataset.sel + (after ? 1 : 0);
  } else if (!isPage && drag.kind === 'photo'){
    after = e.clientX > r.left + r.width / 2;
    drag.to = +over.dataset.pi + (after ? 1 : 0);
  } else if (isPage && drag.kind === 'photo' && +over.dataset.sel !== sel){
    drag.into = +over.dataset.sel;
  } else return;
  over.classList.add(drag.into != null ? 'mk-into' : after ? 'mk-after' : 'mk-before');
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
});
document.addEventListener('drop', function(e){
  if (!drag) return;
  e.preventDefault();
  var d = drag, pg = P.pages[sel], keepPage = pg, keepPhoto = pg && pg.photos[ph];
  endDrag();
  if (d.kind === 'page' && d.to != null) reorder(P.pages, d.from, d.to);
  else if (d.kind === 'photo' && d.to != null) reorder(pg.photos, d.from, d.to);
  else if (d.kind === 'photo' && d.into != null){
    var x = pg.photos.splice(d.from, 1)[0], dest = P.pages[d.into];
    dest.photos.push(x);
    /* 마지막 사진을 옮겨 빈 페이지가 되면 없애고 옮겨 간 페이지를 연다 */
    if (!pg.photos.length){ P.pages.splice(sel, 1); keepPage = dest; keepPhoto = x; }
  } else return;
  sel = P.pages.indexOf(keepPage);
  ph = Math.max(0, keepPage.photos.indexOf(keepPhoto));
  redraw();
});
document.addEventListener('dragend', endDrag);

/* ---------------- 저장 ---------------- */
function note(msg, on){ $('state').textContent = msg || '—'; $('state').classList.toggle('on', !!on); }
/* byRef : 사진을 미리 올려 둔 sha 로 보낸다 (서버로 보낼 때).
   아니면 사진 data URL 을 그대로 넣는다 (서버가 없을 때 내려받는 파일) */
function payload(byRef){
  var cp = P.cover === 'photo' ? locate(coverPhoto()) : null;
  return {
    id:v('fId'), cat:$('fCat').value, date:v('fDate'), title:v('fTitle'), sub:v('fSub'),
    meta:v('fMeta'), tags:v('fTags'), lede:v('fLede'),
    cover: cp ? 'photo' : (P.cover === 'photo' ? 'gridnum' : P.cover),
    coverFile: cp ? fileName(cp.i, cp.j) : undefined,
    replaces: P.editing || undefined,   // 고치던 글의 원래 주소 (주소를 바꿨으면 서버가 원래 글을 지운다)
    pages: P.pages.map(function(p, i){
      return { title:p.title, text:p.text, photos:p.photos.map(function(f, j){
        return byRef ? { file:fileName(i, j), sha:f.sha } : { file:fileName(i, j), data:f.url };
      }) };
    })
  };
}

/* /api/save 호출. 비밀번호가 틀리면 err.key, 서버에 닿지 못하면 fetch 의 TypeError 가 그대로 올라간다 */
async function api(key, body){
  var res = await fetch('/api/save', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-archive-key':key },
    body: JSON.stringify(body)
  });
  if (res.status === 401){ var e = new Error('비밀번호가 틀렸습니다.'); e.key = true; throw e; }
  if (!res.ok){
    var j = null; try { j = await res.json(); } catch (x) {}
    throw new Error(j && j.error ? j.error : 'HTTP ' + res.status);
  }
  return res.json();
}

/* 사진을 3장씩 동시에 한 장씩 올린다. 이미 올린 사진(sha 있음)은 건너뛰어
   중간에 실패해도 다시 누르면 남은 사진부터 이어 올린다 */
async function uploadPhotos(key){
  var all = allPhotos(), todo = all.filter(function(f){ return !f.sha; });
  var done = all.length - todo.length, next = 0;
  note('사진 올리는 중... ' + done + ' / ' + all.length);
  async function worker(){
    while (next < todo.length){
      var f = todo[next++];
      f.sha = (await api(key, { blob:f.url })).sha;
      keepPhoto(f);   // 새로고침한 뒤 다시 올려도 이 사진은 건너뛰게
      note('사진 올리는 중... ' + (++done) + ' / ' + all.length);
    }
  }
  await Promise.all([worker(), worker(), worker()]);
}

/* 비밀번호는 들어올 때 한 번 확인하고(gate) 브라우저 탭을 닫을 때까지 기억한다 */
function getKey(){ try { return sessionStorage.getItem('archive-key'); } catch (e) { return null; } }
function setKey(k){
  try { if (k) sessionStorage.setItem('archive-key', k); else sessionStorage.removeItem('archive-key'); } catch (e) {}
}

/* 비어 있는 칸 : 안내를 띄우고 그 칸으로 데려간다 */
function miss(id, msg){
  note(msg, true);
  var el = $(id);
  el.classList.add('miss');
  el.scrollIntoView({ block:'center', behavior:'smooth' });
  el.focus({ preventScroll:true });
}

var saving = false;
$('save').addEventListener('click', async function(){
  if (saving) return;
  document.querySelectorAll('.miss').forEach(function(el){ el.classList.remove('miss'); });
  if (!v('fTitle')){ miss('fTitle', '제목을 먼저 적어주세요.'); return; }
  if (!v('fId')){ miss('fId', '주소(식별자)를 적어주세요. 예: r-016'); return; }
  if (!P.pages.length){ note('사진이 한 장도 없습니다.', true); $('drop').scrollIntoView({ block:'center', behavior:'smooth' }); return; }
  var big = tooBig();
  if (big.length){ note(big.map(function(f){ return f.name; }).join(', ') + ' 이(가) 너무 큽니다. 빼거나 JPEG 로 바꿔 넣어주세요.', true); return; }

  var key = getKey();
  if (!key){ showGate(); return; }

  saving = true;
  var wasEditing = P.editing;
  var btn = $('save');
  btn.disabled = true;
  btn.textContent = '올리는 중…';
  try {
    await uploadPhotos(key);
    note('글을 올리는 중...');
    await api(key, payload(true));
    clearAll();
    postsData = null;
    note((wasEditing ? '고친 내용을 올렸습니다.' : '올렸습니다.') + ' 1~2분 뒤 사이트에 반영됩니다. 화면을 비웠으니 새 글을 쓰면 됩니다.', true);
  } catch (err) {
    if (err.key){
      setKey(null);
      showGate('비밀번호가 바뀌었거나 틀렸습니다. 다시 들어와 주세요. 쓰던 글은 그대로 남아 있습니다.');
    } else if (err instanceof TypeError){
      note('서버에 연결하지 못했습니다. 파일로 내려받습니다.', true);
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(payload(false), null, 2)], {type:'application/json'}));
      a.download = (v('fId') || 'post') + '.json';
      a.click();
    } else note('올리지 못했습니다: ' + err.message + ' — 다시 누르면 남은 사진부터 이어 올립니다.', true);
  } finally {
    saving = false;
    btn.disabled = false;
    btn.textContent = '올리기';
  }
});

/* ---------------- 초안 ----------------
   글 · 순서는 localStorage, 사진은 용량이 커서 IndexedDB 에 둔다.
   새로고침하거나 창을 닫았다 열어도 사진 · 글 · 순서 · 표지가 그대로 돌아온다.
   사진을 찾지 못한 페이지의 글은 pending 에 남겨 두고, 같은 이름의 사진을 다시 넣으면 그 페이지에 되살린다 */
var ready = false;   // 초안을 다 불러오기 전에는 저장하지 않는다 (빈 상태로 덮어쓰지 않게)
var pending = [];    // {title, text, names}

function draft(){
  if (!ready) return;
  try {
    localStorage.setItem('archive-post', JSON.stringify({
      f:['fTitle','fSub','fLede','fCat','fDate','fId','fMeta','fTags'].reduce(function(o,k){ o[k] = $(k).value; return o; }, {}),
      cover:P.cover,
      coverId:P.coverPhoto && P.coverPhoto.id,
      pages:P.pages.map(function(p){ return {
        title:p.title, text:p.text,
        ids:p.photos.map(function(f){ return f.id; }),
        names:p.photos.map(function(f){ return f.name; })
      }; }),
      pending:pending,
      editing:P.editing || null
    }));
  } catch (e) {}
}

var DB = null;
function idb(){
  if (!DB) DB = new Promise(function(ok, no){
    var r = indexedDB.open('archive-admin', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('photos'); };
    r.onsuccess = function(){ ok(r.result); };
    r.onerror = function(){ no(r.error); };
  });
  return DB;
}
/* fn(store) 가 돌려준 요청들은 트랜잭션이 끝난 뒤 .result 로 읽는다 */
function idbDo(mode, fn){
  return idb().then(function(db){ return new Promise(function(ok, no){
    var tx = db.transaction('photos', mode), out = fn(tx.objectStore('photos'));
    tx.oncomplete = function(){ ok(out); };
    tx.onerror = tx.onabort = function(){ no(tx.error); };
  }); });
}
function newId(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function keepPhoto(f){
  return idbDo('readwrite', function(st){
    st.put({ url:f.url, thumb:f.thumb, ext:f.ext, name:f.name, sha:f.sha || null }, f.id);
  }).catch(function(){});
}

/* 새로 넣은 사진이 들어간 빈 페이지에, 같은 이름의 사진을 가졌던 페이지의 글을 되살린다 */
function revive(){
  var n = 0;
  P.pages.forEach(function(p){
    if (p.title || p.text) return;
    var names = p.photos.map(function(f){ return f.name; });
    var k = pending.findIndex(function(q){ return (q.names || []).some(function(x){ return names.indexOf(x) >= 0; }); });
    if (k < 0) return;
    p.title = pending[k].title || ''; p.text = pending[k].text || '';
    pending.splice(k, 1); n++;
  });
  return n;
}

var readyResolve, readyP = new Promise(function(r){ readyResolve = r; });   // 초안을 다 불러오면 풀린다
(function restore(){
  var s = null;
  try { s = JSON.parse(localStorage.getItem('archive-post') || 'null'); } catch (e) {}
  if (!s){ ready = true; readyResolve(); return; }
  Object.keys(s.f || {}).forEach(function(k){ if ($(k)) $(k).value = s.f[k]; });
  P.cover = s.cover || P.cover;
  P.editing = s.editing || null;
  pending = (s.pending || []).slice();
  var pages = s.pages || [];
  function keepText(p){ if (p.title || p.text) pending.push({ title:p.title || '', text:p.text || '', names:p.names || [] }); }
  function done(){
    ready = true;
    if (P.pages.length){ sel = 0; ph = 0; }
    redraw();
    readyResolve();
    var got = P.pages.length ? (P.editing ? P.editing + ' 을(를) 고치던 초안을 불러왔습니다.' : '지난 초안을 불러왔습니다.') : '';
    var left = pending.length ? ' 사진을 찾지 못한 페이지 글 ' + pending.length + '개가 남아 있습니다. 같은 사진을 다시 넣으면 제자리에 돌아옵니다.' : '';
    note((got + left).trim(), !!left);
  }
  if (!pages.length){ done(); return; }
  note('지난 초안을 불러오는 중...');
  idbDo('readonly', function(st){ return { k:st.getAllKeys(), v:st.getAll() }; }).then(function(out){
    var byId = {};
    out.k.result.forEach(function(id, i){ byId[id] = Object.assign({ id:id }, out.v.result[i]); });
    var used = {};
    pages.forEach(function(p){
      var photos = (p.ids || []).map(function(id){ return byId[id]; }).filter(Boolean);
      photos.forEach(function(f){ used[f.id] = true; });
      if (photos.length) P.pages.push({ title:p.title || '', text:p.text || '', photos:photos });
      else keepText(p);
    });
    P.coverPhoto = byId[s.coverId] || null;
    /* 어느 페이지에서도 쓰지 않는 사진은 정리 */
    var gone = Object.keys(byId).filter(function(id){ return !used[id]; });
    if (gone.length) idbDo('readwrite', function(st){ gone.forEach(function(id){ st.delete(id); }); }).catch(function(){});
    done();
  }).catch(function(){ pages.forEach(keepText); done(); });
})();

/* ---------------- 새 글 ----------------
   초안(글 · 사진)을 모두 비운다. 올리기에 성공하면 자동으로, 아니면 '새 글'을 두 번 눌러서 */
function clearAll(){
  P.pages = []; P.cover = 'gridnum'; P.coverPhoto = null; P.editing = null;
  pending = []; sel = -1; ph = 0;
  ['fTitle','fSub','fLede','fId','fMeta','fTags'].forEach(function(k){ $(k).value = ''; });
  $('fCat').value = 'research';
  $('fDate').value = today();
  grow($('fLede'));
  try { localStorage.removeItem('archive-post'); } catch (e) {}
  idbDo('readwrite', function(st){ st.clear(); }).catch(function(){});
  redraw();
}
/* 지우기 · 덮어쓰기처럼 되돌릴 수 없는 버튼은 두 번 눌러야 실행된다 (3초 안에) */
function arm(btn, label, fn){
  if (btn.classList.contains('armed')){
    clearTimeout(btn._t);
    btn.classList.remove('armed');
    btn.textContent = btn._label;
    fn();
    return;
  }
  btn._label = btn.textContent;
  btn.classList.add('armed');
  btn.textContent = label;
  btn._t = setTimeout(function(){ btn.classList.remove('armed'); btn.textContent = btn._label; }, 3000);
}
$('fresh').addEventListener('click', function(){
  arm(this, '한 번 더 누르면 지웁니다', function(){
    clearAll();
    note('새 글을 시작합니다.');
    $('fTitle').focus();
  });
});
function hasDraft(){ return P.pages.length > 0 || !!v('fTitle'); }

/* ---------------- 들어오기 (비밀번호) ----------------
   서버에 비밀번호를 확인한 뒤에만 화면을 연다. 서버가 없는 주소(내 컴퓨터 파일, GitHub Pages)면 Vercel 주소를 알려 준다 */
var ADMIN_HOME = 'https://archive-gamma-snowy.vercel.app/admin.html';
var NO_SERVER = '이 주소에서는 서버에 연결할 수 없습니다. <a href="' + ADMIN_HOME + '">' + ADMIN_HOME.replace('https://', '') + '</a> 에서 열어 주세요.';
function showGate(msg){
  $('gate').hidden = false;
  $('gateMsg').innerHTML = msg || '';
  $('gatePw').value = '';
  setTimeout(function(){ $('gatePw').focus(); }, 0);
}
$('gateForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var key = $('gatePw').value.trim(), btn = this.querySelector('button');
  if (!key){ $('gateMsg').textContent = '비밀번호를 적어주세요.'; return; }
  btn.disabled = true;
  $('gateMsg').textContent = '확인하는 중...';
  try {
    await api(key, { check:true });
    setKey(key);
    afterLogin();
  } catch (err) {
    $('gateMsg').innerHTML = err.key ? '비밀번호가 틀렸습니다.' : err instanceof TypeError ? NO_SERVER : '확인하지 못했습니다: ' + esc(err.message);
    $('gatePw').select();
  } finally {
    btn.disabled = false;
  }
});
$('logout').addEventListener('click', function(){ setKey(null); showGate('나갔습니다. 쓰던 글은 이 브라우저에 그대로 남아 있습니다.'); });

function afterLogin(){
  $('gate').hidden = true;
  readyP.then(openFromLink);
}
/* 사이트의 '수정' 링크(admin.html?edit=주소)로 들어왔을 때 */
function openFromLink(){
  var id = new URLSearchParams(location.search).get('edit');
  if (!id) return;
  history.replaceState(null, '', location.pathname);
  if (P.editing === id && P.pages.length) return;
  if (hasDraft()){
    showPosts();
    note('쓰던 초안이 있습니다. 목록에서 ' + id + ' 의 수정을 두 번 누르면 초안 대신 그 글을 불러옵니다.', true);
  } else editPost(id);
}

/* ---------------- 올린 글 목록 · 수정 · 삭제 ---------------- */
var postsData = null;   // { items, detail, files } — 서버가 GitHub 에서 바로 읽은 것
async function showPosts(){
  $('posts').hidden = false;
  $('postsBtn').textContent = '글 목록 닫기';
  $('postsList').innerHTML = '<p class="msg">불러오는 중...</p>';
  try {
    postsData = await api(getKey(), { list:true });
    drawPosts();
  } catch (err) {
    if (err.key){ setKey(null); showGate('다시 들어와 주세요.'); return; }
    $('postsList').innerHTML = '<p class="msg">목록을 불러오지 못했습니다: ' + esc(err.message) + '</p>';
  }
}
function hidePosts(){ $('posts').hidden = true; $('postsBtn').textContent = '글 목록'; }
function drawPosts(){
  var items = postsData.items.slice().sort(function(a, b){ return String(b.date).localeCompare(String(a.date)); });
  $('postsN').textContent = items.length + '개';
  $('postsList').innerHTML = items.length ? items.map(function(it){
    return '<div class="pr' + (P.editing === it.id ? ' on' : '') + '">'
      + '<span class="d">' + esc(it.date || '') + '</span><span class="c">' + esc(CAT[it.cat] || it.cat || '') + '</span>'
      + '<b>' + esc(it.title) + '</b><span class="i">' + esc(it.id) + '</span>'
      + '<button type="button" data-edit="' + esc(it.id) + '">수정</button>'
      + '<button type="button" data-del="' + esc(it.id) + '">삭제</button>'
      + '</div>';
  }).join('') : '<p class="msg">아직 올린 글이 없습니다.</p>';
}
$('postsBtn').addEventListener('click', function(){ if ($('posts').hidden) showPosts(); else hidePosts(); });
$('postsList').addEventListener('click', function(e){
  var b = e.target.closest('[data-edit],[data-del]');
  if (!b) return;
  if (b.dataset.edit){
    var id = b.dataset.edit;
    if (hasDraft() && P.editing !== id) arm(b, '쓰던 초안을 덮어씁니다 · 한 번 더', function(){ editPost(id); });
    else editPost(id);
  } else arm(b, '한 번 더 누르면 삭제', function(){ deletePost(b.dataset.del); });
});

async function deletePost(id){
  note(id + ' 을(를) 지우는 중...');
  try {
    await api(getKey(), { remove:id });
    if (P.editing === id){ P.editing = null; draft(); drawMode(); }
    note(id + ' 을(를) 지웠습니다. 1~2분 뒤 사이트에서 사라집니다.', true);
    showPosts();
  } catch (err) {
    if (err.key){ setKey(null); showGate('다시 들어와 주세요.'); return; }
    note('지우지 못했습니다: ' + err.message, true);
  }
}

/* 사진 한 장을 서버에서 받아 admin 의 사진으로. 이미 저장소에 있는 사진이라 sha 를 같이 두어 다시 올리지 않는다 */
async function fetchPhoto(key, src, files){
  var res = await fetch('/api/save', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-archive-key':key },
    body: JSON.stringify({ img:src })
  });
  if (res.status === 401){ var e = new Error('비밀번호가 틀렸습니다.'); e.key = true; throw e; }
  if (!res.ok) throw new Error(src + ' 을(를) 불러오지 못했습니다 (' + res.status + ')');
  var blob = await res.blob();
  var url = await new Promise(function(ok){ var r = new FileReader(); r.onload = function(){ ok(r.result); }; r.readAsDataURL(blob); });
  var img = await new Promise(function(ok, no){ var i = new Image(); i.onload = function(){ ok(i); }; i.onerror = no; i.src = url; });
  var name = src.split('/').pop();
  return { id:newId(), url:url, thumb:draw(img, 320, 'image/jpeg', 0.8), ext:(name.split('.').pop() || 'jpg').toLowerCase(), name:name, sha:(files && files[src]) || null, src:src };
}

/* 올린 글을 admin 으로 불러온다 : 글 · 순서 · 표지 · 사진 전부. 다 고친 뒤 올리기를 누르면 같은 자리에 덮어쓴다 */
async function editPost(id){
  var key = getKey();
  hidePosts();
  note(id + ' 을(를) 불러오는 중...');
  try {
    var data = postsData && postsData.detail[id] ? postsData : (postsData = await api(key, { list:true }));
    var it = data.items.find(function(x){ return x.id === id; }), d = data.detail[id] || { sections:[] };
    if (!it) throw new Error(id + ' 글이 없습니다');
    /* 사이트의 사진 주소 뒤 ?v=지문 은 떼고 파일 경로만 쓴다 */
    var figures = (d.figures || []).map(function(f){ return Object.assign({}, f, { src:f.src && f.src.split('?')[0] }); });
    var coverSrc = (it.coverSrc || '').split('?')[0];
    var secs = (d.sections || []).map(function(s){
      return { s:s, nums:(Array.isArray(s.figs) ? s.figs : typeof s.fig === 'number' ? [s.fig] : []).filter(function(n){ return figures[n] && figures[n].src; }) };
    });
    var jobs = [];
    secs.forEach(function(x){ x.nums.forEach(function(n){ if (jobs.indexOf(figures[n].src) < 0) jobs.push(figures[n].src); }); });

    var got = {}, next = 0, done = 0;
    async function worker(){
      while (next < jobs.length){
        var src = jobs[next++];
        got[src] = await fetchPhoto(key, src, data.files);
        note('사진 불러오는 중... ' + (++done) + ' / ' + jobs.length);
      }
    }
    await Promise.all([worker(), worker(), worker()]);

    clearAll();
    $('fTitle').value = it.title || '';
    $('fSub').value = it.sub || '';
    var lede = d.lede != null ? d.lede : (d.lead || '');
    $('fLede').value = lede === it.sub ? '' : lede;   // 들어가는 말이 비어 있으면 서버가 한 줄 설명을 대신 넣는다
    grow($('fLede'));
    $('fCat').value = CAT[it.cat] ? it.cat : 'research';
    $('fDate').value = it.date || today();
    $('fId').value = it.id;
    $('fMeta').value = it.meta || '';
    $('fTags').value = it.tags || '';

    var skipped = 0;
    secs.forEach(function(x){
      var photos = x.nums.map(function(n){ return Object.assign({}, got[figures[n].src], { id:newId() }); });
      if (!photos.length){ skipped++; return; }
      var cap = figures[x.nums[0]].cap;
      P.pages.push({ title:cap != null ? cap : (x.s.h || ''), text:(x.s.p || []).join('\n\n'), photos:photos });
    });
    allPhotos().forEach(keepPhoto);
    P.cover = it.cover || 'gridnum';
    if (P.cover === 'photo') P.coverPhoto = allPhotos().find(function(f){ return f.src === coverSrc; }) || null;
    P.editing = id;
    sel = P.pages.length ? 0 : -1; ph = 0;
    redraw();
    window.scrollTo(0, 0);
    note(id + ' 을(를) 고치는 중입니다. 다 고친 뒤 올리기를 누르면 덮어씁니다.'
      + (skipped ? ' 사진 없는 절 ' + skipped + '개는 불러오지 못했습니다.' : ''), true);
  } catch (err) {
    if (err.key){ setKey(null); showGate('다시 들어와 주세요.'); return; }
    note('불러오지 못했습니다: ' + err.message, true);
  }
}

/* 상단 바 : 고치는 중이면 어느 글인지 보여 준다 */
function drawMode(){ $('mark').textContent = P.editing ? '고치는 중 · ' + P.editing : '글쓰기'; }

drawStrip(); drawList(); drawEdit(); drawMode();

/* 들어올 때 : 기억한 비밀번호가 있으면 서버에 확인, 없으면 비밀번호 화면 */
(async function boot(){
  var key = getKey();
  if (!key){ showGate(); return; }
  try { await api(key, { check:true }); afterLogin(); }
  catch (err) {
    if (err.key){ setKey(null); showGate('다시 들어와 주세요.'); }
    else if (err instanceof TypeError) showGate(NO_SERVER);
    else afterLogin();
  }
})();
</script>
